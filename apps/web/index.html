<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Code Review Agent</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --surface-subtle: #f1f3f5;
        --surface-hover: #eef2f6;
        --surface-active: #e7edf7;
        --border: rgba(31, 35, 41, 0.1);
        --border-strong: rgba(31, 35, 41, 0.16);
        --text: #1f2329;
        --text-secondary: #626a78;
        --text-tertiary: #9299a5;
        --blue: #4176e6;
        --blue-hover: #3568d4;
        --blue-soft: #edf3fe;
        --green: #239b57;
        --amber: #c78327;
        --red: #d54444;
        --shadow: 0 14px 40px rgba(30, 39, 55, 0.12);
        --sidebar-width: 300px;
        --details-width: 300px;
        --rail-width: 56px;
        --radius-lg: 22px;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; min-width: 320px; overflow: hidden; color: var(--text); background: var(--bg); }
      button, textarea { font: inherit; }
      button { border: 0; cursor: pointer; color: inherit; }
      button:disabled { cursor: wait; opacity: 0.55; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      .app-shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--details-width); height: 100dvh; min-height: 0; transition: grid-template-columns 0.2s var(--ease); }
      .app-shell.sidebar-collapsed { grid-template-columns: var(--rail-width) minmax(0, 1fr) var(--details-width); }
      .app-shell.details-collapsed { grid-template-columns: var(--sidebar-width) minmax(0, 1fr) 0; }
      .app-shell.sidebar-collapsed.details-collapsed { grid-template-columns: var(--rail-width) minmax(0, 1fr) 0; }
      .sidebar, .details-panel { min-width: 0; overflow: hidden; background: var(--surface); }
      .sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
      .sidebar-header { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; }
      .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; font-size: 14px; font-weight: 650; white-space: nowrap; }
      .brand-mark { display: grid; place-items: center; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 10px; color: #fff; background: var(--blue); font-weight: 800; font-size: 16px; box-shadow: 0 4px 10px rgba(65,118,230,.25); }
      .icon-button { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: var(--text-secondary); background: transparent; font-size: 17px; transition: background .15s var(--ease), color .15s var(--ease); }
      .icon-button:hover { color: var(--text); background: var(--surface-hover); }
      .collapse-symbol { transition: transform .2s var(--ease); }
      .sidebar-collapsed .collapse-symbol { transform: rotate(180deg); }
      .sidebar-content { flex: 1; min-height: 0; overflow: auto; padding: 0 12px 16px; }
      .sidebar-collapsed .sidebar-content { padding-inline: 10px; }
      .new-session { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 38px; margin: 4px 0 18px; border-radius: 12px; color: #fff; background: var(--blue); font-size: 13px; font-weight: 600; box-shadow: 0 5px 12px rgba(65,118,230,.18); transition: background .15s var(--ease), transform .15s var(--ease); }
      .new-session:hover { background: var(--blue-hover); transform: translateY(-1px); }
      .sidebar-collapsed .new-session { width: 36px; margin-inline: auto; font-size: 0; }
      .sidebar-collapsed .new-session .plus { font-size: 20px; }
      .section-label { margin: 16px 8px 8px; color: var(--text-tertiary); font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
      .sidebar-collapsed .section-label, .sidebar-collapsed .session-copy, .sidebar-collapsed .mcp-copy, .sidebar-collapsed .sidebar-footer-copy { display: none; }
      .session-list, .mcp-list { display: grid; gap: 4px; }
      .session { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 38px; padding: 8px 10px; border-radius: 10px; text-align: left; color: var(--text-secondary); background: transparent; font-size: 12px; transition: background .15s var(--ease), color .15s var(--ease); }
      .session:hover { color: var(--text); background: var(--surface-hover); }
      .session.active { color: var(--text); background: var(--surface-active); }
      .session-dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: #b4bcc8; }
      .session.active .session-dot { background: var(--blue); box-shadow: 0 0 0 3px rgba(65,118,230,.14); }
      .session-copy { overflow: hidden; min-width: 0; }
      .session-name, .session-path { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .session-name { font-weight: 550; }
      .session-path { margin-top: 2px; color: var(--text-tertiary); font-size: 11px; }
      .session-section-heading { display: flex; align-items: center; justify-content: space-between; margin: 17px 0 7px; }
      .session-section-heading .section-label { margin: 0; }
      .archive-toggle { padding: 3px 6px; border-radius: 6px; color: var(--text-tertiary); background: transparent; font-size: 10px; }
      .archive-toggle:hover, .archive-toggle.active { color: var(--blue); background: var(--blue-soft); }
      .session-row { display: flex; align-items: center; gap: 4px; }
      .session-row > .session { min-width: 0; flex: 1; }
      .session-archive { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; color: var(--text-tertiary); background: transparent; font-size: 12px; opacity: .35; transition: opacity .15s var(--ease), background .15s var(--ease), color .15s var(--ease); }
      .session-row:hover .session-archive, .session-archive:focus-visible { opacity: 1; }
      .session-archive:hover { color: var(--blue); background: var(--blue-soft); }
      .mcp-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 34px; padding: 6px 8px; border-radius: 9px; color: var(--text-secondary); background: var(--surface-subtle); font-size: 11px; }
      .mcp-copy { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mcp-actions { display: flex; gap: 2px; }
      .mcp-actions button { padding: 3px 4px; border-radius: 6px; color: var(--text-tertiary); background: transparent; font-size: 10px; }
      .mcp-actions button:hover { color: var(--blue); background: var(--blue-soft); }
      .mcp-status { display: inline-flex; align-items: center; gap: 4px; }
      .mcp-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
      .mcp-status.disabled::before, .mcp-status.error::before { background: var(--red); }
      .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
      .sidebar-footer button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 9px; color: var(--text-secondary); background: transparent; text-align: left; font-size: 12px; }
      .sidebar-footer button:hover { background: var(--surface-hover); color: var(--text); }
      .sidebar-collapsed .sidebar-footer button { justify-content: center; padding-inline: 0; }
      .workspace { display: grid; grid-template-rows: 60px minmax(0, 1fr) auto; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); }
      .workspace-header { display: flex; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 1px solid var(--border); background: rgba(247,248,250,.82); backdrop-filter: blur(12px); }
      .mobile-menu { display: none; }
      .session-heading { min-width: 0; flex: 1; }
      .session-heading strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 650; }
      .session-heading span { display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-tertiary); font-size: 11px; }
      .connection-state { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; color: var(--text-secondary); font-size: 11px; }
      .connection-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
      .connection-state.disconnected::before { background: var(--amber); }
      .conversation { position: relative; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; scroll-behavior: smooth; }
      .conversation::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 20%, rgba(65,118,230,.07), transparent 38%); opacity: .75; }
      .conversation-body { position: relative; width: min(748px, calc(100% - 40px)); min-height: 100%; margin: 0 auto; padding: 34px 0 28px; }
      .hero { display: grid; place-items: center; min-height: calc(100% - 20px); padding: 9vh 0 26vh; text-align: center; }
      .hero-inner { width: min(560px, 100%); }
      .hero-mark { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 17px; color: #fff; background: var(--blue); font-size: 25px; font-weight: 800; box-shadow: 0 10px 24px rgba(65,118,230,.22); }
      .hero h1 { margin: 0; font-size: clamp(25px, 3vw, 34px); letter-spacing: -.03em; font-weight: 680; }
      .hero p { margin: 10px auto 18px; color: var(--text-secondary); font-size: 14px; line-height: 1.65; }
      .workspace-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border: 1px solid var(--border); border-radius: 99px; color: var(--text-secondary); background: rgba(255,255,255,.72); font-size: 11px; }
      .workspace-chip::before { content: "⌘"; color: var(--blue); font-size: 13px; }
      .workspace-chip-button { cursor: pointer; }
      .workspace-chip-button:hover { border-color: rgba(65,118,230,.28); color: var(--text); background: var(--blue-soft); }
      .message { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; margin-bottom: 24px; }
      .avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; color: #fff; background: var(--text); font-size: 10px; font-weight: 700; }
      .message.user .avatar { color: #fff; background: var(--blue); }
      .message-body { min-width: 0; padding-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; font-size: 14px; }
      .message.user .message-body { padding: 11px 14px; border-radius: 4px 16px 16px 16px; background: var(--surface); box-shadow: 0 1px 2px rgba(31,35,41,.03); }
      .event-row { display: flex; align-items: center; gap: 8px; margin: 13px 0 13px 40px; color: var(--text-tertiary); font-size: 11px; }
      .event-row::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); }
      .tool-row { margin: 10px 0 14px 40px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.72); }
      .tool-summary { display: flex; align-items: center; gap: 9px; width: 100%; padding: 10px 12px; background: transparent; text-align: left; }
      .tool-summary:hover { background: var(--surface-hover); }
      .tool-icon { display: grid; place-items: center; flex: 0 0 22px; width: 22px; height: 22px; border-radius: 7px; color: var(--blue); background: var(--blue-soft); font-size: 11px; }
      .tool-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
      .tool-status { color: var(--text-tertiary); font-size: 11px; }
      .tool-chevron { color: var(--text-tertiary); transition: transform .15s var(--ease); }
      .tool-row.open .tool-chevron { transform: rotate(180deg); }
      .tool-details { display: none; padding: 0 12px 12px 43px; }
      .tool-row.open .tool-details { display: block; }
      .tool-details pre { margin: 0; max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-secondary); font: 11px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
      .permission-card { margin: 12px 0 16px 40px; padding: 13px; border: 1px solid rgba(199,131,39,.28); border-radius: 13px; background: #fffaf0; }
      .permission-card strong { display: block; color: #8f5c13; font-size: 12px; }
      .permission-card pre { margin: 8px 0 0; color: #765d35; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
      .permission-actions { display: flex; gap: 7px; margin-top: 11px; }
      .permission-actions button { padding: 6px 10px; border-radius: 8px; color: #fff; background: var(--blue); font-size: 11px; font-weight: 600; }
      .permission-actions .deny { background: var(--red); }
      .permission-actions .cancel { color: var(--text-secondary); background: #eceff3; }
      .interaction-card { margin: 12px 0 16px 40px; padding: 13px; border: 1px solid rgba(65,118,230,.26); border-radius: 13px; background: #f5f8ff; }
      .interaction-card strong { display: block; color: #315da9; font-size: 12px; }
      .interaction-card pre { margin: 8px 0 0; color: var(--text-secondary); white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
      .composer-shell { position: relative; z-index: 2; padding: 0 20px 20px; background: linear-gradient(to bottom, transparent, var(--bg) 25%); }
      .composer-card { position: relative; width: min(780px, 100%); margin: 0 auto; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow); }
      .composer-card textarea { display: block; width: 100%; min-height: 64px; max-height: 220px; padding: 16px 17px 8px; border: 0; outline: 0; resize: none; color: var(--text); background: transparent; line-height: 1.5; font-size: 14px; }
      .composer-card textarea::placeholder { color: var(--text-tertiary); }
      .composer-toolbar { display: flex; align-items: center; gap: 5px; min-height: 43px; padding: 5px 9px 9px; }
      .toolbar-button { display: inline-flex; align-items: center; gap: 6px; height: 29px; padding: 0 9px; border-radius: 8px; color: var(--text-secondary); background: transparent; font-size: 11px; }
      .toolbar-button:hover { color: var(--text); background: var(--surface-hover); }
      .toolbar-spacer { flex: 1; }
      .model-trigger { max-width: 194px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .context-meter { color: var(--text-tertiary); font-size: 10px; }
      .send-button { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; background: var(--blue); font-size: 15px; transition: background .15s var(--ease), transform .15s var(--ease); }
      .send-button:hover { background: var(--blue-hover); transform: translateY(-1px); }
      .send-button:disabled { opacity: .5; transform: none; }
      .model-popover { position: absolute; right: 43px; bottom: 49px; z-index: 5; width: 250px; padding: 7px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); box-shadow: var(--shadow); }
      .model-popover[hidden] { display: none; }
      .popover-label { padding: 7px 9px 6px; color: var(--text-tertiary); font-size: 10px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
      .model-option { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px; border-radius: 9px; color: var(--text-secondary); background: transparent; text-align: left; font-size: 12px; }
      .model-option:hover { background: var(--surface-hover); color: var(--text); }
      .model-option.selected { color: var(--text); background: var(--blue-soft); }
      .model-check { width: 14px; color: var(--blue); font-weight: 700; }
      .model-meta { display: block; margin-top: 2px; color: var(--text-tertiary); font-size: 10px; }
      .details-panel { display: flex; flex-direction: column; border-left: 1px solid var(--border); transition: opacity .2s var(--ease); }
      .details-collapsed .details-panel { opacity: 0; pointer-events: none; }
      .details-header { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--border); }
      .details-header strong { font-size: 13px; }
      .details-content { flex: 1; overflow: auto; padding: 14px; }
      .detail-section { padding: 12px 0; border-bottom: 1px solid var(--border); }
      .detail-section:first-child { padding-top: 3px; }
      .detail-label { margin-bottom: 8px; color: var(--text-tertiary); font-size: 10px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
      .detail-value { color: var(--text); font-size: 12px; line-height: 1.5; }
      .detail-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; color: var(--text-secondary); font-size: 11px; }
      .detail-line strong { max-width: 165px; overflow: hidden; color: var(--text); font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
      .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 99px; color: var(--green); background: #edf9f1; font-size: 10px; }
      .status-pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
      .tool-list { display: grid; gap: 5px; }
      .tool-list-item { display: flex; align-items: center; gap: 7px; padding: 5px 0; color: var(--text-secondary); font-size: 11px; }
      .tool-list-item::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
      .empty-detail { color: var(--text-tertiary); font-size: 11px; line-height: 1.5; }
      .session-path-button { display: block; max-width: min(42vw, 420px); padding: 2px 6px; margin: 2px 0 0 -6px; overflow: hidden; border-radius: 6px; color: var(--text-tertiary); background: transparent; text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
      .session-path-button:hover { color: var(--text); background: var(--surface-hover); }
      .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(20, 26, 36, .24); backdrop-filter: blur(5px); }
      .modal-backdrop[hidden] { display: none; }
      .workspace-modal { width: min(520px, 100%); padding: 20px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: 0 22px 70px rgba(30,39,55,.22); }
      .workspace-modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      .workspace-modal-header h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
      .workspace-modal-header p { margin: 6px 0 0; color: var(--text-secondary); font-size: 12px; line-height: 1.5; }
      .workspace-input-label { display: block; margin-bottom: 7px; color: var(--text-secondary); font-size: 11px; font-weight: 600; }
      .workspace-input { width: 100%; height: 40px; padding: 0 11px; border: 1px solid var(--border-strong); border-radius: 10px; outline: none; color: var(--text); background: var(--surface-subtle); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .workspace-input:focus { border-color: rgba(65,118,230,.55); box-shadow: 0 0 0 3px rgba(65,118,230,.12); }
      .workspace-error { min-height: 17px; margin-top: 7px; color: var(--red); font-size: 11px; }
      .workspace-recent { display: grid; gap: 5px; margin-top: 15px; }
      .workspace-recent-label { color: var(--text-tertiary); font-size: 10px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
      .workspace-recent-button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 9px; border-radius: 8px; color: var(--text-secondary); background: transparent; text-align: left; font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .workspace-recent-button:hover { color: var(--text); background: var(--surface-hover); }
      .workspace-recent-button::before { content: "⌂"; color: var(--blue); font: 14px sans-serif; }
      .workspace-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      .workspace-modal-actions button { height: 34px; padding: 0 13px; border-radius: 9px; font-size: 12px; font-weight: 600; }
      .workspace-cancel { color: var(--text-secondary); background: var(--surface-subtle); }
      .workspace-create { color: #fff; background: var(--blue); }
      .workspace-create:hover { background: var(--blue-hover); }
      .workspace-create:disabled { cursor: wait; }
      @media (max-width: 1120px) { :root { --details-width: 260px; } }
      @media (max-width: 900px) {
        .app-shell, .app-shell.sidebar-collapsed { grid-template-columns: var(--rail-width) minmax(0, 1fr) 0; }
        .sidebar .brand, .sidebar .collapse-symbol { display: none; }
        .sidebar-header { justify-content: center; padding-inline: 0; }
        .sidebar-collapsed .brand { display: flex; }
        .sidebar-collapsed .sidebar-header { justify-content: space-between; padding-inline: 13px; }
        .sidebar-collapsed .brand span:last-child, .sidebar-collapsed .section-label, .sidebar-collapsed .session-copy, .sidebar-collapsed .mcp-copy, .sidebar-collapsed .sidebar-footer-copy { display: none; }
        .mobile-menu { display: grid; }
        .workspace-header { padding-inline: 12px; }
        .details-toggle { display: none; }
      }
      @media (max-width: 600px) {
        .app-shell, .app-shell.sidebar-collapsed { grid-template-columns: 1fr 0 0; }
        .sidebar, .details-panel { display: none; }
        .workspace-header { height: 54px; }
        .conversation-body { width: min(100% - 24px, 748px); padding-top: 20px; }
        .hero { padding: 5vh 0 28vh; }
        .composer-shell { padding: 0 10px 10px; }
        .composer-toolbar { flex-wrap: wrap; }
        .context-meter { display: none; }
        .model-trigger { max-width: 150px; }
        .model-popover { right: 43px; bottom: 74px; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="Sessions and MCP">
        <div class="sidebar-header">
          <div class="brand"><span class="brand-mark">⌁</span><span>Code Review Agent</span></div>
          <button id="sidebar-toggle" class="icon-button" type="button" aria-label="Collapse sidebar"><span class="collapse-symbol">‹</span></button>
        </div>
        <div class="sidebar-content">
          <button id="new-session" class="new-session" type="button"><span class="plus">＋</span><span>New session</span></button>
          <div class="session-section-heading"><div class="section-label">Sessions</div><button id="archive-toggle" class="archive-toggle" type="button" aria-pressed="false">Archived</button></div>
          <div id="session-list" class="session-list"></div>
          <div class="section-label">MCP servers</div>
          <div id="mcp-list" class="mcp-list"></div>
        </div>
        <div class="sidebar-footer"><button id="settings-button" type="button"><span>⚙</span><span class="sidebar-footer-copy">Workspace settings</span></button></div>
      </aside>
      <main class="workspace">

        <div id="details-content" class="details-content"></div>
      </aside>
      <div id="workspace-modal" class="modal-backdrop" hidden>
        <form id="workspace-form" class="workspace-modal">
          <div class="workspace-modal-header"><div><h2>Choose a workspace</h2><p>New sessions run their file and terminal tools inside this local directory.</p></div><button id="workspace-close" class="icon-button" type="button" aria-label="Close workspace picker">×</button></div>
          <label class="workspace-input-label" for="workspace-input">Local folder path</label>
          <input id="workspace-input" class="workspace-input" type="text" autocomplete="off" spellcheck="false" placeholder="D:\\Develop\\your-repository" />
          <label class="workspace-input-label" for="permission-preset">Work mode</label>
          <select id="permission-preset" class="workspace-input workspace-select">
            <option value="ask-on-write" selected>Coding · ask before changes</option>
            <option value="workspace-write">Coding · write in workspace</option>
            <option value="ask-on-execute">Coding · ask before commands</option>
            <option value="read-only">Read only · review</option>

        </form>
      </div>
    </div>
    <script>
      (() => {
        const state = { session: null, events: new Map(), source: null, tools: new Map(), mcp: [], models: null, sidebarCollapsed: false, detailsOpen: true, recentWorkspaces: [], showArchived: false };
        const app = document.querySelector('#app');
        const list = document.querySelector('#session-list');
        const mcpList = document.querySelector('#mcp-list');
        const archiveToggle = document.querySelector('#archive-toggle');
        const conversation = document.querySelector('#conversation');
        const status = document.querySelector('#status');
        const title = document.querySelector('#session-title');
        const path = document.querySelector('#session-path');
        const input = document.querySelector('#input');
        const send = document.querySelector('#send');
        const modelTrigger = document.querySelector('#model-trigger');
        const modelPopover = document.querySelector('#model-popover');
        const modeTrigger = document.querySelector('#mode-trigger');
        const modePopover = document.querySelector('#mode-popover');
        const details = document.querySelector('#details-content');
        const workspaceModal = document.querySelector('#workspace-modal');
        const workspaceForm = document.querySelector('#workspace-form');
        const workspaceInput = document.querySelector('#workspace-input');
        const workspaceError = document.querySelector('#workspace-error');
        const workspaceRecent = document.querySelector('#workspace-recent');
        const workspaceCreate = document.querySelector('#workspace-create');
        const permissionPreset = document.querySelector('#permission-preset');
        const api = async (url, options) => { const response = await fetch(url, options); if (!response.ok) throw new Error(await response.text()); return response.json(); };
        const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
        const currentModel = () => state.models?.current || state.models?.defaultModel || 'deepseek-v4-flash';
        const modeLabels = { 'read-only': 'Read only', 'workspace-write': 'Workspace write', 'ask-on-write': 'Ask on write', 'ask-on-execute': 'Ask on execute', 'danger-full-access': 'Full access' };
        const currentMode = () => state.session?.permissionPreset || 'ask-on-write';
        const refreshSessionList = async () => { const payload = await api(`/v1/sessions?include_archived=${state.showArchived}`); showSessions(payload); archiveToggle.classList.toggle('active', state.showArchived); archiveToggle.setAttribute('aria-pressed', String(state.showArchived)); };
        const setStatus = (text, connected = true) => { status.textContent = text; status.classList.toggle('disconnected', !connected); };
        const addEvent = (event) => { if (!event || state.events.has(event.sequence)) return; state.events.set(event.sequence, event); render(); };
        const orderedEvents = () => [...state.events.values()].sort((a, b) => a.sequence - b.sequence);
        const addEventRow = (parent, text) => { const row = document.createElement('div'); row.className = 'event-row'; row.textContent = text; parent.append(row); };
        const appendMessage = (parent, role, content) => { const row = document.createElement('div'); row.className = `message ${role}`; const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = role === 'user' ? 'You' : 'AI'; const body = document.createElement('div'); body.className = 'message-body'; body.textContent = content; row.append(avatar, body); parent.append(row); return body; };
        const appendTool = (parent, name, text, statusText = 'Completed') => { const row = document.createElement('div'); row.className = 'tool-row'; const summary = document.createElement('button'); summary.className = 'tool-summary'; summary.type = 'button'; const icon = document.createElement('span'); icon.className = 'tool-icon'; icon.textContent = '⌘'; const heading = document.createElement('span'); heading.className = 'tool-title'; const source = state.tools.get(name)?.source; heading.textContent = source?.kind === 'mcp' ? `MCP · ${source.serverName} · ${source.rawName}` : `Tool · ${name}`; const toolStatus = document.createElement('span'); toolStatus.className = 'tool-status'; toolStatus.textContent = statusText; const chevron = document.createElement('span'); chevron.className = 'tool-chevron'; chevron.textContent = '⌄'; const body = document.createElement('div'); body.className = 'tool-details'; const pre = document.createElement('pre'); pre.textContent = text; body.append(pre); summary.append(icon, heading, toolStatus, chevron); summary.onclick = () => row.classList.toggle('open'); row.append(summary, body); parent.append(row); };
        const appendPermission = (parent, payload) => { const row = document.createElement('div'); row.className = 'permission-card'; const heading = document.createElement('strong'); heading.textContent = `Approval required · ${payload.toolName || 'tool'}`; const body = document.createElement('pre'); body.textContent = `${payload.reason || 'This tool needs permission'}\ncaller: ${payload.caller || 'agent'}\nworkspace: ${payload.workspaceRoot || state.session?.workspaceRoot || '.'}\nexpires: ${payload.expiresAt || 'unknown'}\n${JSON.stringify(payload.input || {}, null, 2)}`; const actions = document.createElement('div'); actions.className = 'permission-actions'; for (const [label, value, className] of [['Approve','approved',''],['Deny','denied','deny'],['Cancel','cancelled','cancel']]) { const button = document.createElement('button'); button.type = 'button'; button.textContent = label; if (className) button.className = className; button.onclick = async () => { button.disabled = true; try { await api(`/v1/sessions/${encodeURIComponent(state.session.id)}/permissions/${encodeURIComponent(payload.permissionId)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: value }) }); } catch (error) { setStatus(error.message, false); button.disabled = false; } }; actions.append(button); } row.append(heading, body, actions); parent.append(row); };
        const appendInteraction = (parent, payload) => { const row = document.createElement('div'); row.className = 'interaction-card'; const heading = document.createElement('strong'); heading.textContent = 'Agent needs your input'; const body = document.createElement('pre'); body.textContent = `${payload.question || 'Question'}\nexpires: ${payload.expiresAt || 'unknown'}`; const actions = document.createElement('div'); actions.className = 'permission-actions'; const options = Array.isArray(payload.options) ? payload.options : []; for (const option of options) { const button = document.createElement('button'); button.type = 'button'; button.textContent = option.label || option.value; button.onclick = async () => { button.disabled = true; try { await api(`/v1/sessions/${encodeURIComponent(state.session.id)}/interactions/${encodeURIComponent(payload.interactionId)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: 'answered', answer: option.value }) }); } catch (error) { setStatus(error.message, false); button.disabled = false; } }; actions.append(button); } if (payload.allowFreeform !== false) { const input = document.createElement('input'); input.className = 'workspace-input'; input.placeholder = 'Type an answer'; const button = document.createElement('button'); button.type = 'button'; button.textContent = 'Send'; button.onclick = async () => { if (!input.value.trim()) return; button.disabled = true; try { await api(`/v1/sessions/${encodeURIComponent(state.session.id)}/interactions/${encodeURIComponent(payload.interactionId)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: 'answered', answer: input.value }) }); } catch (error) { setStatus(error.message, false); button.disabled = false; } }; actions.append(input, button); } row.append(heading, body, actions); parent.append(row); };
        const render = () => {
          if (state.session) renderModes();
          const wasNearBottom = conversation.scrollHeight === 0 || conversation.scrollHeight - conversation.scrollTop - conversation.clientHeight <= 64;
          conversation.innerHTML = '';
          const ordered = orderedEvents();
          const hasMessage = ordered.some((event) => event.type === 'user/message' || event.type === 'assistant/chunk' || event.type === 'assistant/message');
          if (!hasMessage) { const hero = document.createElement('div'); hero.className = 'hero'; hero.innerHTML = `<div class="hero-inner"><div class="hero-mark">⌁</div><h1>Ready to review your code</h1><p>Ask the agent to inspect a repository, explain a file, or help you plan the next change.</p><span class="workspace-chip">${esc(state.session?.workspaceRoot || '.')}</span></div>`; conversation.append(hero); }
          else {
            const body = document.createElement('div'); body.className = 'conversation-body'; conversation.append(body); const assistant = new Map(); const permissions = new Map(); const interactions = new Map();
            for (const event of ordered) {
              if (event.type === 'user/message') appendMessage(body, 'user', event.payload?.content || '');
              else if (event.type === 'assistant/chunk') { const key = event.turnId || 'assistant'; if (!assistant.has(key)) assistant.set(key, appendMessage(body, 'assistant', '')); assistant.get(key).textContent += event.payload?.text || ''; }
              else if (event.type === 'assistant/message') { const key = event.turnId || 'assistant'; if (!assistant.has(key)) assistant.set(key, appendMessage(body, 'assistant', event.payload?.content || '')); else assistant.get(key).textContent = event.payload?.content || ''; }
              else if (event.type === 'tool/call') { const payload = event.payload || {}; appendTool(body, payload.name || 'tool', `${payload.caller || 'agent'} · ${payload.workspaceRoot || ''}\n${JSON.stringify(payload.input || {}, null, 2)}`, 'Running'); }
              else if (event.type === 'tool/progress') { const payload = event.payload || {}; addEventRow(body, `${payload.toolCallId || 'tool'} · ${payload.phase || payload.status || 'running'}${payload.text ? ` · ${payload.text}` : ''}`); }
              else if (event.type === 'tool/result') { const payload = event.payload || {}; const result = payload.result || {}; appendTool(body, payload.toolCallId || 'tool', JSON.stringify({ ...result, output: result.modelView ?? result.output, audit: undefined, modelView: undefined }, null, 2), payload.status || 'Completed'); }
              else if (event.type === 'permission/requested') permissions.set(event.payload?.permissionId, event.payload);
              else if (event.type === 'permission/resolved' && permissions.has(event.payload?.permissionId)) permissions.get(event.payload.permissionId).status = event.payload.status;
              else if (event.type === 'interaction/requested') interactions.set(event.payload?.interactionId, event.payload);
              else if (event.type === 'interaction/resolved' && interactions.has(event.payload?.interactionId)) interactions.get(event.payload.interactionId).status = event.payload.status;
              else if (event.type === 'plan/updated') addEventRow(body, `Plan · ${event.payload?.status || 'updated'}${event.payload?.content ? ` · ${event.payload.content}` : ''}`);
              else if (event.type === 'todo/updated') addEventRow(body, `Todo list · ${Array.isArray(event.payload?.todos) ? event.payload.todos.length : 0} item(s)`);
              else if (event.type === 'diff/preview') appendTool(body, 'diff', JSON.stringify(event.payload?.diff || {}, null, 2), 'Preview');
              else if (event.type === 'mcp/server') addEventRow(body, `MCP ${event.payload?.serverName || 'server'} · ${event.payload?.status || 'updated'}`);
              else if (event.type !== 'session/created' && !event.type.startsWith('assistant/') && !event.type.startsWith('user/') && !event.type.startsWith('tool/') && !event.type.startsWith('permission/') && !event.type.startsWith('interaction/') && !event.type.startsWith('plan/') && !event.type.startsWith('todo/') && !event.type.startsWith('mcp/') && event.type !== 'diff/preview') addEventRow(body, `${event.type} · #${event.sequence}`);
            }
            for (const permission of permissions.values()) if (!permission.status || permission.status === 'pending') appendPermission(body, permission);
            for (const interaction of interactions.values()) if (!interaction.status || interaction.status === 'pending') appendInteraction(body, interaction);
          }
          renderDetails();
          requestAnimationFrame(() => { if (wasNearBottom) conversation.scrollTop = conversation.scrollHeight; });
        };
        const renderWorkspaceRecent = () => { workspaceRecent.innerHTML = ''; const roots = [...new Set(state.recentWorkspaces.filter(Boolean))].slice(0, 6); if (!roots.length) return; const label = document.createElement('div'); label.className = 'workspace-recent-label'; label.textContent = 'Recent workspaces'; workspaceRecent.append(label); roots.forEach((root) => { const button = document.createElement('button'); button.type = 'button'; button.className = 'workspace-recent-button'; button.textContent = root; button.onclick = () => { workspaceInput.value = root; workspaceError.textContent = ''; workspaceInput.focus(); }; workspaceRecent.append(button); }); };
        const openWorkspacePicker = () => { workspaceError.textContent = ''; workspaceInput.value = state.session?.workspaceRoot || ''; permissionPreset.value = currentMode(); renderWorkspaceRecent(); workspaceModal.hidden = false; workspaceInput.focus(); workspaceInput.select(); };
        const closeWorkspacePicker = () => { workspaceModal.hidden = true; workspaceError.textContent = ''; };
        const showSessions = (payload) => { const sessions = Array.isArray(payload) ? payload : payload.sessions || []; const visible = sessions.filter((session) => Boolean(session.archived) === state.showArchived); state.sidebarSessions = visible; state.recentWorkspaces = sessions.map((session) => session.workspaceRoot); list.innerHTML = ''; if (!visible.length) { const empty = document.createElement('div'); empty.className = 'empty-detail'; empty.textContent = state.showArchived ? 'No archived sessions.' : 'No active sessions.'; list.append(empty); return; } for (const session of visible) { const row = document.createElement('div'); row.className = 'session-row'; const button = document.createElement('button'); button.className = `session ${state.session?.id === session.id ? 'active' : ''}`; button.type = 'button'; const name = session.title || session.workspaceRoot?.split(/[\/]/).filter(Boolean).pop() || 'New session'; button.innerHTML = `<span class="session-dot"></span><span class="session-copy"><span class="session-name">${esc(name)}</span><span class="session-path">${esc(session.workspaceRoot || '.')}</span></span>`; button.onclick = () => openSession(session.id); const archive = document.createElement('button'); archive.className = 'session-archive'; archive.type = 'button'; archive.title = session.archived ? 'Restore session' : 'Archive session'; archive.setAttribute('aria-label', session.archived ? 'Restore session' : 'Archive session'); archive.textContent = session.archived ? '↩' : '▱'; archive.onclick = async (event) => { event.stopPropagation(); archive.disabled = true; try { await api(`/v1/sessions/${encodeURIComponent(session.id)}/archive`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !session.archived }) }); await refreshSessionList(); if (state.session?.id === session.id) { state.session.archived = !session.archived; render(); } } catch (error) { setStatus(error.message, false); archive.disabled = false; } }; row.append(button, archive); list.append(row); } };
        const renderMcp = () => { mcpList.innerHTML = ''; for (const server of state.mcp) { const name = server.config?.name || server.name; const row = document.createElement('div'); row.className = 'mcp-row'; const label = document.createElement('span'); label.className = `mcp-copy mcp-status ${server.status === 'disabled' ? 'disabled' : server.status === 'error' ? 'error' : ''}`; label.textContent = `${name} · ${server.status}`; const actions = document.createElement('span'); actions.className = 'mcp-actions'; const reconnect = document.createElement('button'); reconnect.type = 'button'; reconnect.textContent = '↻'; reconnect.title = 'Reconnect'; reconnect.onclick = async () => { reconnect.disabled = true; try { await api(`/v1/mcp/servers/${encodeURIComponent(name)}/reconnect`, { method: 'POST' }); state.mcp = (await api('/v1/mcp/servers')).servers || []; renderMcp(); renderDetails(); } finally { reconnect.disabled = false; } }; const toggle = document.createElement('button'); toggle.type = 'button'; toggle.textContent = server.status === 'disabled' ? '＋' : '−'; toggle.title = server.status === 'disabled' ? 'Enable' : 'Disable'; toggle.onclick = async () => { await api(`/v1/mcp/servers/${encodeURIComponent(name)}/${server.status === 'disabled' ? 'enable' : 'disable'}`, { method: 'POST' }); state.mcp = (await api('/v1/mcp/servers')).servers || []; renderMcp(); renderDetails(); }; actions.append(reconnect, toggle); row.append(label, actions); mcpList.append(row); } if (!state.mcp.length) { const empty = document.createElement('div'); empty.className = 'empty-detail'; empty.textContent = 'No MCP servers configured.'; mcpList.append(empty); } };
        const renderModels = (payload) => { state.models = payload; modelTrigger.textContent = `Model · ${currentModel()}`; modelPopover.innerHTML = '<div class="popover-label">Choose a model</div>'; for (const model of payload?.models || []) { const option = document.createElement('button'); option.type = 'button'; option.className = `model-option ${model === currentModel() ? 'selected' : ''}`; option.innerHTML = `<span class="model-check">${model === currentModel() ? '✓' : ''}</span><span>${esc(model)}<span class="model-meta">DeepSeek API</span></span>`; option.onclick = async () => { modelPopover.hidden = true; modelTrigger.setAttribute('aria-expanded', 'false'); modelTrigger.disabled = true; try { await api('/v1/models', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ model }) }); renderModels(await api('/v1/models')); setStatus(`Model · ${model}`); renderDetails(); } catch (error) { setStatus(error.message, false); } finally { modelTrigger.disabled = false; } }; modelPopover.append(option); } };
        const renderModes = () => { modeTrigger.textContent = `◉ Mode · ${modeLabels[currentMode()] || currentMode()}`; modePopover.innerHTML = '<div class="popover-label">Choose a work mode for this session</div>'; for (const [value, label] of Object.entries(modeLabels)) { const option = document.createElement('button'); option.type = 'button'; option.className = `model-option ${value === currentMode() ? 'selected' : ''}`; option.innerHTML = `<span class="model-check">${value === currentMode() ? '✓' : ''}</span><span>${label}<span class="model-meta">${value === 'read-only' ? 'Inspect without changing files' : value === 'danger-full-access' ? 'Run tools without approval' : 'Permission-controlled coding workflow'}</span></span>`; option.onclick = async () => { modePopover.hidden = true; modeTrigger.setAttribute('aria-expanded', 'false'); if (value === currentMode() || !state.session) return; modeTrigger.disabled = true; try { state.session = await api(`/v1/sessions/${encodeURIComponent(state.session.id)}/mode`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ permissionPreset: value }) }); renderModes(); renderDetails(); setStatus(`Mode · ${label}`); } catch (error) { setStatus(error.message, false); } finally { modeTrigger.disabled = false; } }; modePopover.append(option); } };
        const renderDetails = () => { const connected = state.mcp.filter((server) => server.status !== 'disabled' && server.status !== 'error').length; details.innerHTML = `<div class="detail-section"><div class="detail-label">Model</div><div class="detail-value">${esc(currentModel())}</div><div class="detail-line"><span>Provider</span><strong>${esc(state.models?.provider || 'DeepSeek-compatible')}</strong></div><div class="detail-line"><span>Default</span><strong>${esc(state.models?.defaultModel || 'deepseek-v4-flash')}</strong></div></div><div class="detail-section"><div class="detail-label">Session</div><div class="detail-line"><span>Status</span><span class="status-pill">Connected</span></div><div class="detail-line"><span>Events</span><strong>${state.events.size}</strong></div><div class="detail-line"><span>Workspace</span><strong title="${esc(state.session?.workspaceRoot || '.')}">${esc(state.session?.workspaceRoot || '.')}</strong></div></div><div class="detail-section"><div class="detail-label">MCP</div><div class="detail-line"><span>Servers</span><strong>${connected}/${state.mcp.length}</strong></div><div class="detail-line"><span>Tools</span><strong>${state.tools.size}</strong></div></div><div class="detail-section"><div class="detail-label">Tools</div><div id="detail-tools" class="tool-list"></div></div><div class="detail-section"><div class="detail-label">Permissions</div><div class="empty-detail">Tool approvals appear here when a turn needs confirmation.</div></div>`; const toolList = details.querySelector('#detail-tools'); const names = [...state.tools.keys()].slice(0, 8); if (!names.length) toolList.innerHTML = '<div class="empty-detail">No tools discovered.</div>'; else names.forEach((name) => { const row = document.createElement('div'); row.className = 'tool-list-item'; row.textContent = name; toolList.append(row); }); };
        const openSession = async (id) => { if (state.source) state.source.close(); state.session = await api(`/v1/sessions/${encodeURIComponent(id)}`); title.textContent = state.session.title || 'Coding session'; path.textContent = `Workspace · ${state.session.workspaceRoot || '.'}`; state.events.clear(); const history = await api(`/v1/sessions/${encodeURIComponent(id)}/events?format=json`); for (const event of history) addEvent(event); state.source = new EventSource(`/v1/sessions/${encodeURIComponent(id)}/events?after_sequence=${state.session.lastSequence || 0}`); const types = ['session/created','session/updated','user/message','turn/queued','turn/started','step/started','step/ended','turn/ended','assistant/chunk','assistant/message','task/created','task/updated','task/ended','plan/updated','todo/updated','tool/call','tool/progress','tool/result','diff/preview','permission/requested','permission/resolved','interaction/requested','interaction/resolved','mcp/server','mcp/tool','agent/status','agent/error']; types.forEach((type) => state.source.addEventListener(type, (message) => addEvent(JSON.parse(message.data)))); state.source.onerror = () => setStatus('Reconnecting…', false); state.source.onopen = () => setStatus('Connected', true); await refreshSessionList(); render(); };
        const createSession = async (workspaceRoot) => { const checked = await api('/v1/workspaces/validate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ workspaceRoot }) }); const session = await api('/v1/sessions', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ workspaceRoot: checked.workspaceRoot, permissionPreset: permissionPreset.value }) }); await openSession(session.id); };
        const newSession = () => openWorkspacePicker();
        modeTrigger.textContent = '◉ Mode · Ask on write';
        const boot = async () => { const result = await api('/v1/sessions'); const tools = await api('/v1/tools'); state.tools = new Map((tools.tools || []).map((tool) => [tool.name, tool])); renderModels(await api('/v1/models')); state.mcp = (await api('/v1/mcp/servers')).servers || []; renderMcp(); if (result.sessions?.length) await openSession(result.sessions[0].id); else await createSession('.'); };
        document.querySelector('#sidebar-toggle').onclick = () => { state.sidebarCollapsed = !state.sidebarCollapsed; app.classList.toggle('sidebar-collapsed', state.sidebarCollapsed); };
        document.querySelector('#details-toggle').onclick = () => { state.detailsOpen = !state.detailsOpen; app.classList.toggle('details-collapsed', !state.detailsOpen); };
        document.querySelector('#details-close').onclick = () => { state.detailsOpen = false; app.classList.add('details-collapsed'); };
        document.querySelector('#new-session').onclick = () => newSession();
        archiveToggle.onclick = async () => { state.showArchived = !state.showArchived; try { await refreshSessionList(); } catch (error) { setStatus(error.message, false); } };
        document.querySelector('#session-path').onclick = () => openWorkspacePicker();
        document.querySelector('#workspace-close').onclick = () => closeWorkspacePicker();
        document.querySelector('#workspace-cancel').onclick = () => closeWorkspacePicker();
        workspaceModal.addEventListener('click', (event) => { if (event.target === workspaceModal) closeWorkspacePicker(); });
        workspaceForm.addEventListener('submit', async (event) => { event.preventDefault(); const workspaceRoot = workspaceInput.value.trim(); if (!workspaceRoot) { workspaceError.textContent = 'Enter a local folder path.'; return; } workspaceCreate.disabled = true; workspaceError.textContent = ''; try { await createSession(workspaceRoot); closeWorkspacePicker(); } catch (error) { workspaceError.textContent = error.message; } finally { workspaceCreate.disabled = false; } });
        document.querySelector('#mobile-menu').onclick = () => { state.sidebarCollapsed = false; app.classList.remove('sidebar-collapsed'); };
        modelTrigger.onclick = () => { modelPopover.hidden = !modelPopover.hidden; modelTrigger.setAttribute('aria-expanded', String(!modelPopover.hidden)); };
        modeTrigger.onclick = () => { modePopover.hidden = !modePopover.hidden; modeTrigger.setAttribute('aria-expanded', String(!modePopover.hidden)); renderModes(); };
        document.addEventListener('click', (event) => { if (!modelPopover.hidden && !modelPopover.contains(event.target) && event.target !== modelTrigger) { modelPopover.hidden = true; modelTrigger.setAttribute('aria-expanded', 'false'); } if (!modePopover.hidden && !modePopover.contains(event.target) && event.target !== modeTrigger) { modePopover.hidden = true; modeTrigger.setAttribute('aria-expanded', 'false'); } });
        input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 220)}px`; });
        input.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); document.querySelector('#composer').requestSubmit(); } });
        document.querySelector('#composer').addEventListener('submit', async (event) => { event.preventDefault(); const content = input.value.trim(); if (!content || !state.session) return; send.disabled = true; input.value = ''; input.style.height = 'auto'; try { await api(`/v1/sessions/${encodeURIComponent(state.session.id)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ content }) }); } catch (error) { setStatus(error.message, false); } finally { send.disabled = false; input.focus(); } });
        boot().catch((error) => { setStatus(error.message, false); conversation.innerHTML = `<div class="hero"><div class="hero-inner"><div class="hero-mark">!</div><h1>Unable to connect</h1><p>${esc(error.message)}</p></div></div>`; });
      })();
    </script>
  </body>
</html>
