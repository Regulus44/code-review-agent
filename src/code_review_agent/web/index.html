<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Review Agent</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f7fb;
  --panel: #ffffff;
  --panel-muted: #f1f4f8;
  --border: #d7dee8;
  --text: #18212f;
  --muted: #5c6b80;
  --accent: #0f62fe;
  --accent-strong: #0043ce;
  --success: #198038;
  --warning: #d97706;
  --danger: #c81e1e;
  --sidebar-w: 260px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  height: 100vh;
  overflow: hidden;
}

.app-layout {
  height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
}

/* ── Sidebar ───────────────────────────────────────────── */

.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header button {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
}

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.sidebar-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.lang-select {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  background: #fff;
}

.health-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.health-ok { background: var(--success); }
.health-err { background: var(--danger); }
.health-chk { background: var(--warning); }

.session-list { display: grid; gap: 4px; }

.session-item {
  border: 1px solid transparent;
  background: transparent;
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  display: grid;
  gap: 4px;
  font: inherit;
  text-align: left;
  width: 100%;
  position: relative;
}

.session-item .archive-btn {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  display: none;
  border-radius: 4px;
}
.session-item:hover .archive-btn { display: flex; align-items: center; justify-content: center; }
.session-item .archive-btn:hover { background: #fee2e2; color: var(--danger); }
.session-item:hover { background: var(--panel-muted); }
.session-item.active {
  border-color: var(--accent);
  background: #eef4ff;
}

.session-title {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-time {
  font-size: 11px;
  color: var(--muted);
}

/* ── Main workspace ─────────────────────────────────────── */

.main-workspace {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg);
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.welcome-state {
  color: var(--muted);
  font-size: 15px;
  text-align: center;
  margin: auto;
  line-height: 1.8;
}

.empty-state {
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  padding: 20px;
}
.error-text { color: var(--danger); }

/* ── Message bubbles ────────────────────────────────────── */

.msg-group {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.msg-bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg-user {
  align-self: flex-end;
  background: #eef4ff;
  border: 1px solid #c4d4f5;
}

.msg-assistant {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
}

.msg-system {
  align-self: center;
  background: #fefce8;
  border: 1px solid #fde68a;
  font-style: italic;
  max-width: 85%;
  font-size: 12px;
}

.msg-error {
  align-self: center;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--danger);
  max-width: 85%;
  font-size: 12px;
}

/* ── Loading bubble ─────────────────────────────────────── */

.loading-bubble {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.loading-bubble .dots {
  display: flex;
  gap: 4px;
}

.loading-bubble .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
.loading-bubble .dot:nth-child(2) { animation-delay: 0.2s; }
.loading-bubble .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}

.loading-text {
  font-size: 13px;
  color: var(--muted);
}

/* ── Tool accordion ─────────────────────────────────────── */

.tool-accordion {
  align-self: flex-start;
  max-width: 75%;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: #f8fafc;
}

.tool-accordion summary {
  cursor: pointer;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.tool-accordion summary:hover { background: #eef0f4; }

.tool-accordion-body {
  padding: 8px 12px;
  display: grid;
  gap: 8px;
  border-top: 1px solid var(--border);
}

.tool-step {
  font-size: 12px;
  display: grid;
  gap: 4px;
}

.tool-step-header {
  font-weight: 600;
  color: var(--text);
}

.tool-step-args,
.tool-step-result {
  font-family: "Cascadia Code", "Fira Code", monospace;
  font-size: 11px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 8px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 200px;
  overflow-y: auto;
}

.tool-step-error {
  color: var(--danger);
  font-weight: 500;
}

/* ── Chat input area ────────────────────────────────────── */

.chat-input-area {
  border-top: 1px solid var(--border);
  background: var(--panel);
  padding: 0;
}

.config-bar {
  display: flex;
  gap: 8px;
  padding: 8px 16px 0;
  align-items: center;
}

.config-bar select {
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  background: #fff;
  max-width: 180px;
}

.config-bar .spacer { flex: 1; }

.icon-btn {
  width: 32px;
  height: 32px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}
.icon-btn img {
   display: block;
 }
.icon-btn:hover { background: var(--panel-muted); }

/* ── Settings panel ─────────────────────────────────────── */

.config-panel {
  margin: 8px 16px 0;
  padding: 12px 14px;
  background: var(--panel-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: grid;
  gap: 10px;
  grid-template-columns: 1fr 1fr;
}

.config-panel[hidden] {
  display: none !important;
}

.config-panel label {
  display: grid;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
}

.config-panel input,
.config-panel select {
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font: inherit;
  font-size: 12px;
}

.config-panel .wide { grid-column: 1 / -1; }

.input-row {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  align-items: flex-end;
}

.input-row textarea {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
  font-size: 13px;
  resize: none;
  min-height: 42px;
  max-height: 150px;
}

.input-row button {
  flex-shrink: 0;
  padding: 10px 20px;
  font-weight: 600;
}

.input-row button.danger-outline {
  background: #fff;
  color: var(--danger);
  border-color: #fecaca;
  font-weight: 600;
}
.input-row button.danger-outline:hover {
  background: #fef2f2;
  border-color: var(--danger);
}

/* ── Buttons ────────────────────────────────────────────── */

button {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  font: inherit;
  cursor: pointer;
}
button:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

button.secondary {
  background: #fff;
  color: var(--text);
  border-color: var(--border);
}
button.secondary:hover { background: var(--panel-muted); }

/* ── Responsive ─────────────────────────────────────────── */

@media (max-width: 768px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .sidebar.open {
    display: flex;
    position: fixed;
    z-index: 10;
    left: 0;
    top: 0;
    bottom: 0;
    width: var(--sidebar-w);
  }
  .msg-bubble { max-width: 90%; }
  .chat-messages { padding: 12px 16px; }
  .config-panel { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <button id="newSessionBtn">+ 新建对话</button>
    </div>
    <div class="sidebar-body">
      <div id="sessionList" class="session-list">
        <div class="empty-state">暂无对话</div>
      </div>
    </div>
    <div class="sidebar-footer">
      <select id="langSelect" class="lang-select" aria-label="语言">
        <option value="zh">中文</option>
        <option value="en">EN</option>
      </select>
      <span id="healthDot" class="health-dot health-chk" title="检查中"></span>
    </div>
  </aside>

  <main class="main-workspace">
    <div id="chatMessages" class="chat-messages">
      <div class="welcome-state">
        选择一个已有的对话，<br>或点击左侧 <strong>+ 新建对话</strong> 开始。
      </div>
    </div>
    <div class="chat-input-area">
      <div class="config-bar">
        <select id="providerSelect" aria-label="Provider"></select>
        <select id="modelSelect" aria-label="Model"></select>
        <span class="spacer"></span>
        <button id="settingsToggle" class="icon-btn" title="会话设置"><img src="/assets/images/config.svg" alt="设置" width="18" height="18" /></button>
      </div>
      <div id="configPanel" class="config-panel" hidden>
        <label class="wide">
          仓库路径
          <input id="cfgWorkspace" type="text" value="D:\Develop\code-review-agent" />
        </label>
        <label>
          最大迭代
          <input id="cfgMaxIterations" type="number" min="1" value="100" />
        </label>
        <label>
          最大 Tokens
          <input id="cfgMaxTokens" type="number" min="1" placeholder="默认" />
        </label>
      </div>
      <div class="input-row">
        <textarea id="chatInput"
          placeholder="输入消息…" rows="1"
          disabled></textarea>
        <button id="stopBtn" hidden>停止</button>
        <button id="sendBtn" disabled>发送</button>
      </div>
    </div>
  </main>
</div>

<script>
const I18N = {
  zh: {
    health_checking: "检查中",
    health_ok: "API 正常",
    health_error: "API 异常",
    new_session: "新建对话",
    no_sessions: "暂无对话",
    select_session: "选择一个已有的对话，",
    or_new: "或点击左侧",
    to_start: "开始。",
    new_chat: "新对话",
    send: "发送",
    input_placeholder: "输入消息…",
    agent_thinking: "Agent 正在处理…",
    settings_title: "会话设置",
    workspace_root: "仓库路径",
    mode: "任务模式",
    mode_overview: "仓库总览",
    mode_review: "代码审查",
    max_iterations: "最大迭代",
    max_tokens: "最大 Tokens",
    max_tokens_placeholder: "默认",
    provider: "Provider",
    model: "Model",
    request_failed: "请求失败",
    turn_failed: "Turn 失败",
    turn_cancelled: "Turn 已取消",
    turn_timeout: "Turn 超时",
    chat_empty: "对话为空，发送第一条消息开始。",
    tool_called: "调用了 {count} 个工具",
    tool_args: "参数",
    tool_result: "结果",
    tool_error: "错误",
    archived: "已归档",
    archived_desc: "此对话已归档，无法发送新消息。",
    stop: "停止",
    archive: "归档",
    archive_confirm: "确定归档这个对话吗？",
    stop_first: "请先停止当前请求",
    settings: "设置",
  },
  en: {
    health_checking: "Checking",
    health_ok: "API OK",
    health_error: "API Error",
    new_session: "New Chat",
    no_sessions: "No conversations",
    select_session: "Select a conversation,",
    or_new: "or click",
    to_start: "to start.",
    new_chat: "New Chat",
    send: "Send",
    input_placeholder: "Type a message…",
    agent_thinking: "Agent is working…",
    settings_title: "Session Settings",
    workspace_root: "Workspace Root",
    mode: "Mode",
    mode_overview: "Repository Overview",
    mode_review: "Code Review",
    max_iterations: "Max Iterations",
    max_tokens: "Max Tokens",
    max_tokens_placeholder: "default",
    provider: "Provider",
    model: "Model",
    request_failed: "Request failed",
    turn_failed: "Turn failed",
    turn_cancelled: "Turn cancelled",
    turn_timeout: "Turn timed out",
    chat_empty: "No messages yet. Send the first one.",
    tool_called: "Called {count} tools",
    tool_args: "Args",
    tool_result: "Result",
    tool_error: "Error",
    archived: "Archived",
    archived_desc: "This conversation is archived and read-only.",
    stop: "Stop",
    archive: "Archive",
    archive_confirm: "Archive this conversation?",
    stop_first: "Please stop the current request first",
    settings: "Settings",
  },
};

const state = {
  sessions: [],
  selectedSessionId: null,
  lastSequence: 0,
  activeTurnId: null,
  pollTimer: null,
  modelProviders: [],
  lang: localStorage.getItem("ui_lang") || "zh",
  pendingUserMessage: null,
  pendingLoadingBubble: false,
  currentSession: null,
  currentMessages: [],
};

function t(key) {
  const table = I18N[state.lang] || I18N.zh;
  return table[key] || I18N.zh[key] || key;
}

// ── Reusable utilities (kept from original) ──────────────────

async function requestJson(url, options = {}) {
  const response = await fetch(url, {
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
    ...options,
  });
  if (!response.ok) {
    let message = `${t("request_failed")}: ${response.status}`;
    try { const p = await response.json(); message = p.detail || JSON.stringify(p); } catch (_) {}
    throw new Error(message);
  }
  return response.json();
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function timestampText(value) {
  if (!value) return "-";
  const d = new Date(value);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  if (isToday) return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("zh-CN", { month: "short", day: "numeric" }) + " " +
    d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
}

function formatStatus(status) {
  const map = {
    idle: "空闲", running: "运行中", archived: "已归档",
    queued: "排队中", completed: "已完成", failed: "失败",
    cancelled: "已取消", max_iterations: "达到上限",
    model_output_truncated: "输出截断",
  };
  return map[status] || status || "未知";
}

function statusClass(status) {
  const map = {
    completed: "status-chip status-completed",
    running: "status-chip status-running", queued: "status-chip status-running",
    failed: "status-chip status-failed", cancelled: "status-chip status-cancelled",
    max_iterations: "status-chip status-failed",
    model_output_truncated: "status-chip status-failed",
    idle: "status-chip status-idle", archived: "status-chip status-cancelled",
  };
  return map[status] || "status-chip status-queued";
}

function statusDot(status) {
  const map = {
    idle: "var(--muted)", running: "var(--warning)", queued: "var(--warning)",
    completed: "var(--success)", failed: "var(--danger)", cancelled: "var(--muted)",
    max_iterations: "var(--danger)", model_output_truncated: "var(--danger)",
    archived: "var(--muted)",
  };
  return map[status] || "var(--muted)";
}

function providerLabel(provider) {
  const names = { deepseek: "DeepSeek", siliconflow: "SiliconFlow", mimo: "MiMo" };
  const base = names[provider.name] || provider.name;
  const hint = state.lang === "zh" ? "未配置" : "Not configured";
  return provider.configured ? base : base + " (" + hint + ")";
}

// ── DOM refs ─────────────────────────────────────────────────

const sidebarBody = document.querySelector(".sidebar-body");
const sessionListEl = document.getElementById("sessionList");
const chatMessages = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");
const stopBtn = document.getElementById("stopBtn");
const providerSelect = document.getElementById("providerSelect");
const modelSelect = document.getElementById("modelSelect");
const settingsToggle = document.getElementById("settingsToggle");
const configPanel = document.getElementById("configPanel");
const cfgWorkspace = document.getElementById("cfgWorkspace");
const cfgMaxIterations = document.getElementById("cfgMaxIterations");
const cfgMaxTokens = document.getElementById("cfgMaxTokens");
const healthDot = document.getElementById("healthDot");
const langSelect = document.getElementById("langSelect");

// ── Health check ─────────────────────────────────────────────

async function loadHealth() {
  healthDot.className = "health-dot health-chk";
  healthDot.title = t("health_checking");
  try {
    await requestJson("/health");
    healthDot.className = "health-dot health-ok";
    healthDot.title = t("health_ok");
  } catch (_) {
    healthDot.className = "health-dot health-err";
    healthDot.title = t("health_error");
  }
}

// ── Model providers ──────────────────────────────────────────

function renderProviderModelControls(options = {}) {
  if (!state.modelProviders.length) return;
  const preserveModel = options.preserveModel !== false;
  const curProvider = providerSelect.value;
  const curModel = modelSelect.value;

  providerSelect.innerHTML = state.modelProviders
    .map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(providerLabel(p))}</option>`)
    .join("");

  const configured = state.modelProviders.find(p => p.configured);
  const fallback = configured || state.modelProviders[0];
  const names = new Set(state.modelProviders.map(p => p.name));
  const next = names.has(curProvider) ? curProvider : fallback.name;
  providerSelect.value = next;

  const desc = state.modelProviders.find(p => p.name === next) || fallback;
  const models = desc.models?.length ? desc.models : desc.default_model ? [desc.default_model] : [];

  modelSelect.innerHTML = models
    .map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`)
    .join("");

  if (preserveModel && models.includes(curModel)) {
    modelSelect.value = curModel;
  } else if (desc.default_model && models.includes(desc.default_model)) {
    modelSelect.value = desc.default_model;
  } else if (models.length) {
    modelSelect.value = models[0];
  }
}

async function loadModelProviders() {
  try {
    state.modelProviders = await requestJson("/models/providers");
    providerSelect.value = "";
    renderProviderModelControls({ preserveModel: false });
  } catch (_) {}
}

// ── Session list ─────────────────────────────────────────────

function renderSessionList() {
  if (!state.sessions.length) {
    sessionListEl.innerHTML = '<div class="empty-state">' + t("no_sessions") + '</div>';
    return;
  }
  sessionListEl.innerHTML = state.sessions.map(s => {
    const active = s.id === state.selectedSessionId ? " active" : "";
    const title = s.title || s.last_user_input || t("new_chat");
    const dot = statusDot(s.status);
    return '<button class="session-item' + active + '" data-sid="' + escapeHtml(s.id) + '">' +
      '<span class="session-title">' + escapeHtml(title) + '</span>' +
      '<span class="session-time">' +
        '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + dot + ';margin-right:4px;vertical-align:middle;"></span>' +
        timestampText(s.updated_at) +
      '</span>' +
      '<span class="archive-btn" data-archive="' + escapeHtml(s.id) + '" title="' + t("archive") + '">&times;</span>' +
    '</button>';
  }).join("");

  sessionListEl.querySelectorAll("[data-sid]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest(".archive-btn")) return;
      state.selectedSessionId = el.getAttribute("data-sid");
      state.lastSequence = 0;
      state.currentSession = null;
      state.currentMessages = [];
      renderSessionList();
      loadSessionChat();
    });
  });

  sessionListEl.querySelectorAll("[data-archive]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      archiveSession(el.getAttribute("data-archive"));
    });
  });
}

async function loadSessions() {
  try {
    const all = await requestJson("/sessions");
    state.sessions = all.filter(s => s.status !== "archived");
    renderSessionList();
  } catch (e) {
    sessionListEl.innerHTML = '<div class="empty-state error-text">' + escapeHtml(e.message) + '</div>';
  }
}

// ── Chat rendering ───────────────────────────────────────────

function renderChatMessages(messages) {
  if (!messages.length && !state.pendingUserMessage && !state.pendingLoadingBubble) {
    chatMessages.innerHTML = '<div class="empty-state">' + t("chat_empty") + '</div>';
    return;
  }

  const groups = [];
  let currentToolGroup = null;

  for (const msg of messages) {
    if (msg.role === "assistant" && msg.tool_calls && msg.tool_calls.length) {
      if (currentToolGroup) {
        groups.push({ type: "tool_group", steps: currentToolGroup.steps });
      }
      currentToolGroup = { steps: [] };
      for (const tc of msg.tool_calls) {
        currentToolGroup.steps.push({
          tool_name: tc.name,
          tool_call_id: tc.id,
          arguments: tc.arguments,
          raw_arguments: tc.raw_arguments,
          result: null,
          error: false,
        });
      }
      if (msg.content) {
        groups.push({ type: "tool_group", steps: currentToolGroup.steps });
        currentToolGroup = null;
        groups.push({ type: "assistant", content: msg.content });
      }
      continue;
    }

    if (msg.role === "tool") {
      if (currentToolGroup) {
        const step = currentToolGroup.steps.find(s => s.tool_call_id === msg.tool_call_id);
        if (step) {
          step.result = msg.content;
          step.error = msg.is_error || false;
          continue;
        }
      }
      if (currentToolGroup) {
        groups.push({ type: "tool_group", steps: currentToolGroup.steps });
        currentToolGroup = null;
      }
      groups.push({
        type: "tool_group",
        steps: [{
          tool_name: msg.name || msg.tool_call_id || "tool",
          tool_call_id: msg.tool_call_id || "",
          arguments: {},
          raw_arguments: null,
          result: msg.content,
          error: msg.is_error || false,
        }],
      });
      continue;
    }

    if (currentToolGroup) {
      groups.push({ type: "tool_group", steps: currentToolGroup.steps });
      currentToolGroup = null;
    }

    groups.push({ type: msg.role, content: msg.content, ...msg });
  }

  if (currentToolGroup) {
    groups.push({ type: "tool_group", steps: currentToolGroup.steps });
  }

  chatMessages.innerHTML = groups.map(g => {
    if (g.type === "user") {
      return '<div class="msg-bubble msg-user">' + escapeHtml(g.content || "") + '</div>';
    }
    if (g.type === "assistant") {
      return '<div class="msg-bubble msg-assistant">' + formatContent(g.content || "") + '</div>';
    }
    if (g.type === "system") {
      return '<div class="msg-bubble msg-system">' + escapeHtml(g.content || "") + '</div>';
    }
    if (g.type === "tool_group") {
      return renderToolAccordion(g.steps);
    }
    return "";
  }).join("");

  if (state.pendingUserMessage) {
    chatMessages.innerHTML += '<div class="msg-bubble msg-user">' + escapeHtml(state.pendingUserMessage) + '</div>';
  }
  if (state.pendingLoadingBubble) {
    chatMessages.innerHTML += renderLoadingBubble();
  }

  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function formatContent(content) {
  let html = escapeHtml(content);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
    return '<pre style="background:#f1f4f8;padding:8px;border-radius:4px;overflow-x:auto;font-size:12px;margin:6px 0;">' + escapeHtml(code) + '</pre>';
  });
  html = html.replace(/\n/g, "<br>");
  return html;
}

function renderToolAccordion(steps) {
  const toolNames = steps.map(s => s.tool_name).join(", ");
  const summaryText = "&#9881; " + t("tool_called").replace("{count}", steps.length) + ": " + escapeHtml(toolNames);

  const bodyHtml = steps.map(s => {
    let argsHtml = "";
    if (s.arguments && Object.keys(s.arguments).length) {
      argsHtml = '<div class="tool-step-args"><strong>' + t("tool_args") + ':</strong> ' + escapeHtml(s.raw_arguments || JSON.stringify(s.arguments, null, 2)) + '</div>';
    }
    let resultHtml = "";
    if (s.result !== null && s.result !== undefined) {
      const cls = s.error ? " tool-step-error" : "";
      resultHtml = '<div class="tool-step-result' + cls + '"><strong>' + (s.error ? t("tool_error") : t("tool_result")) + ':</strong> ' + escapeHtml(String(s.result).slice(0, 3000)) + '</div>';
    }
    return '<div class="tool-step">' +
      '<div class="tool-step-header">' + escapeHtml(s.tool_name) + '</div>' +
      argsHtml +
      resultHtml +
    '</div>';
  }).join("");

  return '<details class="tool-accordion">' +
    '<summary>' + summaryText + '</summary>' +
    '<div class="tool-accordion-body">' + bodyHtml + '</div>' +
  '</details>';
}

// ── Loading bubble ───────────────────────────────────────────

function renderLoadingBubble() {
  return '<div class="loading-bubble" id="loadingBubble">' +
    '<div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>' +
    '<span class="loading-text">' + t("agent_thinking") + '</span>' +
  '</div>';
}

function removeLoadingBubble() {
  const el = document.getElementById("loadingBubble");
  if (el) el.remove();
}

// ── Session chat load ────────────────────────────────────────

async function loadSessionChat() {
  const sid = state.selectedSessionId;
  if (!sid) return;

  try {
    const [session, messages, turns] = await Promise.all([
      requestJson("/sessions/" + sid),
      requestJson("/sessions/" + sid + "/messages?since_sequence=0"),
      requestJson("/sessions/" + sid + "/turns"),
    ]);

    state.currentSession = session;
    state.currentMessages = messages;

    if (messages.length > 0) {
      state.lastSequence = Math.max(...messages.map(m => m.sequence || 0));
    }

    const hasActive = turns.some(t => t.status === "running" || t.status === "queued");
    if (hasActive) {
      const activeTurn = turns.find(t => t.status === "running" || t.status === "queued");
      if (activeTurn) state.activeTurnId = activeTurn.id;
    } else {
      state.activeTurnId = null;
    }

    state.pendingUserMessage = null;
    state.pendingLoadingBubble = false;
    removeLoadingBubble();
    renderChatMessages(messages);
    updateActionButtons();

    if (hasActive) {
      schedulePoll();
    }
  } catch (e) {
    chatMessages.innerHTML = '<div class="empty-state error-text">' + escapeHtml(e.message) + '</div>';
  }
}

// ── Polling ──────────────────────────────────────────────────

function schedulePoll() {
  if (state.pollTimer) {
    clearTimeout(state.pollTimer);
    state.pollTimer = null;
  }
  state.pollTimer = window.setTimeout(async () => {
    await pollTurnStatus();
  }, 2000);
}

async function pollTurnStatus() {
  const sid = state.selectedSessionId;
  if (!sid || !state.activeTurnId) {
    state.pendingUserMessage = null;
    state.pendingLoadingBubble = false;
    removeLoadingBubble();
    updateActionButtons();
    return;
  }

  try {
    const [session, turns, messages] = await Promise.all([
      requestJson("/sessions/" + sid),
      requestJson("/sessions/" + sid + "/turns"),
      requestJson("/sessions/" + sid + "/messages?after_sequence=" + state.lastSequence),
    ]);

    if (messages.length > 0) {
      state.lastSequence = Math.max(...messages.map(m => m.sequence || 0));
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      removeLoadingBubble();
      updateActionButtons();
      await loadSessionChat();
      return;
    }

    const activeTurn = turns.find(t => t.id === state.activeTurnId);
    if (!activeTurn) {
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      removeLoadingBubble();
      state.activeTurnId = null;
      updateActionButtons();
      await loadSessionChat();
      await loadSessions();
      return;
    }

    const terminalStatuses = ["completed", "failed", "cancelled", "max_iterations", "model_output_truncated"];
    if (terminalStatuses.includes(activeTurn.status)) {
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      removeLoadingBubble();
      state.activeTurnId = null;
      updateActionButtons();
      if (activeTurn.status === "failed" || activeTurn.status === "max_iterations" || activeTurn.status === "model_output_truncated") {
        const errMsg = activeTurn.status === "failed" ? t("turn_failed") : t("turn_failed");
        const detail = activeTurn.failure_reason ? ": " + activeTurn.failure_reason : "";
        chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(errMsg + detail) + '</div>';
      }
      await loadSessionChat();
      await loadSessions();
      return;
    }

    const sessionTerminal = session.status === "idle" && !turns.some(t => t.status === "running" || t.status === "queued");
    if (sessionTerminal) {
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      removeLoadingBubble();
      state.activeTurnId = null;
      updateActionButtons();
      await loadSessionChat();
      return;
    }

    schedulePoll();
  } catch (e) {
    schedulePoll();
  }
}

// ── Send message (optimistic) ────────────────────────────────

async function sendMessage() {
  const message = chatInput.value.trim();
  if (!message) return;

  let sid = state.selectedSessionId;

  if (!sid) {
    const wsRoot = cfgWorkspace.value.trim();
    if (!wsRoot) {
      chatMessages.innerHTML = '<div class="msg-bubble msg-system">请先在设置中填写仓库路径。</div>';
      return;
    }
    try {
      const session = await requestJson("/sessions", {
        method: "POST",
        body: JSON.stringify({
          workspace_root: wsRoot,
          mode: "review",
          max_iterations: parseInt(cfgMaxIterations.value) || 100,
          max_tokens: cfgMaxTokens.value ? parseInt(cfgMaxTokens.value) : undefined,
          provider: providerSelect.value || undefined,
          model: modelSelect.value || undefined,
        }),
      });
      sid = session.id;
      state.selectedSessionId = sid;
      state.lastSequence = 0;
      state.currentSession = session;
      state.currentMessages = [];
      state.pendingUserMessage = message;
      state.pendingLoadingBubble = true;
      await loadSessions();
      renderChatMessages([]);
      updateActionButtons();
    } catch (e) {
      chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(e.message) + '</div>';
      return;
    }
  }

  chatInput.value = "";
  chatInput.style.height = "auto";

  state.pendingUserMessage = message;
  state.pendingLoadingBubble = true;

  renderChatMessages(state.currentMessages);
  updateActionButtons();

  try {
    const turn = await requestJson("/sessions/" + sid + "/turns", {
      method: "POST",
      body: JSON.stringify({ message }),
    });
    state.activeTurnId = turn.id;
    updateActionButtons();
    schedulePoll();
  } catch (e) {
    state.pendingUserMessage = null;
    state.pendingLoadingBubble = false;
    chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(e.message) + '</div>';
    state.activeTurnId = null;
    updateActionButtons();
  }
}

// ── Cancel current turn ──────────────────────────────────────

async function cancelCurrentTurn() {
  if (!state.selectedSessionId || !state.activeTurnId) return;
  stopBtn.disabled = true;
  try {
    await requestJson(
      "/sessions/" + state.selectedSessionId + "/turns/" + state.activeTurnId + "/cancel",
      { method: "POST" },
    );
    state.pendingUserMessage = null;
    state.pendingLoadingBubble = false;
    state.activeTurnId = null;
    removeLoadingBubble();
    updateActionButtons();
    await loadSessionChat();
    await loadSessions();
  } catch (e) {
    chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(e.message) + '</div>';
  } finally {
    stopBtn.disabled = false;
  }
}

// ── Archive session ──────────────────────────────────────────

async function archiveSession(sessionId) {
  if (!confirm(t("archive_confirm"))) return;
  const session = state.sessions.find(s => s.id === sessionId);
  if (session && session.status === "running") {
    chatMessages.innerHTML += '<div class="msg-bubble msg-system">' + t("stop_first") + '</div>';
    return;
  }
  try {
    await requestJson("/sessions/" + sessionId, { method: "DELETE" });
    if (state.selectedSessionId === sessionId) {
      state.selectedSessionId = null;
      state.activeTurnId = null;
      state.currentSession = null;
      state.currentMessages = [];
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      state.lastSequence = 0;
      removeLoadingBubble();
      chatMessages.innerHTML = '<div class="empty-state">' + t("chat_empty") + '</div>';
      updateActionButtons();
    }
    await loadSessions();
  } catch (e) {
    chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(e.message) + '</div>';
  }
}

// ── Action button state machine ──────────────────────────────

function updateActionButtons() {
  const hasActive = !!state.activeTurnId;
  const archived = state.currentSession?.status === "archived";

  chatInput.disabled = archived || hasActive;
  sendBtn.disabled = archived || hasActive;
  stopBtn.hidden = !hasActive;
  stopBtn.disabled = !hasActive;

  if (archived) {
    chatInput.placeholder = t("archived_desc");
  } else if (!hasActive) {
    chatInput.placeholder = t("input_placeholder");
  }
}

function autoResizeTextarea() {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + "px";
}

// ── Event listeners ──────────────────────────────────────────

sendBtn.addEventListener("click", sendMessage);
stopBtn.addEventListener("click", cancelCurrentTurn);
chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
chatInput.addEventListener("input", autoResizeTextarea);

document.getElementById("newSessionBtn").addEventListener("click", () => {
  state.selectedSessionId = null;
  state.lastSequence = 0;
  state.activeTurnId = null;
  state.currentSession = null;
  state.currentMessages = [];
  state.pendingUserMessage = null;
  state.pendingLoadingBubble = false;
  removeLoadingBubble();
  renderSessionList();
  chatMessages.innerHTML = '<div class="empty-state">' + t("chat_empty") + '</div>';
  chatInput.focus();
  updateActionButtons();
});

settingsToggle.addEventListener("click", () => {
  configPanel.hidden = !configPanel.hidden;
});

providerSelect.addEventListener("change", () => {
  renderProviderModelControls({ preserveModel: false });
});

langSelect.addEventListener("change", () => {
  state.lang = langSelect.value === "en" ? "en" : "zh";
  localStorage.setItem("ui_lang", state.lang);
  document.documentElement.lang = state.lang === "en" ? "en" : "zh-CN";
  applyI18n();
  loadSessions();
  if (state.selectedSessionId) loadSessionChat();
});

// ── I18n apply ───────────────────────────────────────────────

function applyI18n() {
  document.getElementById("newSessionBtn").textContent = "+ " + t("new_session");
  if (!state.selectedSessionId) {
    chatInput.placeholder = t("input_placeholder");
  }
  sendBtn.textContent = t("send");
  stopBtn.textContent = t("stop");
  settingsToggle.title = t("settings_title");
  cfgMaxTokens.placeholder = t("max_tokens_placeholder");
  document.querySelector('.config-panel label.wide').childNodes[0].textContent = t("workspace_root");
  const panelLabels = configPanel.querySelectorAll("label:not(.wide)");
  if (panelLabels.length >= 2) {
    panelLabels[0].childNodes[0].textContent = t("max_iterations");
    panelLabels[1].childNodes[0].textContent = t("max_tokens");
  }
  healthDot.title = state.lang === "en"
    ? (healthDot.className.includes("health-ok") ? "API OK" : healthDot.className.includes("health-err") ? "API Error" : "Checking")
    : (healthDot.className.includes("health-ok") ? "API 正常" : healthDot.className.includes("health-err") ? "API 异常" : "检查中");
}

// ── Startup ──────────────────────────────────────────────────

langSelect.value = state.lang === "en" ? "en" : "zh";
document.documentElement.lang = state.lang === "en" ? "en" : "zh-CN";
applyI18n();
loadHealth();
loadModelProviders();
loadSessions();
</script>
