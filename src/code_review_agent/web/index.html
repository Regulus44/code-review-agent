<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Review Agent</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f7fb;
  --panel: #ffffff;
  --panel-muted: #f1f4f8;
  --border: #d7dee8;
  --text: #18212f;
  --muted: #5c6b80;
  --accent: #0f62fe;
  --accent-strong: #0043ce;
  --success: #198038;
  --warning: #d97706;
  --danger: #c81e1e;
  --sidebar-w: 260px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  height: 100vh;
  overflow: hidden;
}

.app-layout {
  height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
}

/* ── Sidebar ───────────────────────────────────────────── */

.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header button {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
}

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.sidebar-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.lang-select {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  background: #fff;
}

.health-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.health-ok { background: var(--success); }
.health-err { background: var(--danger); }
.health-chk { background: var(--warning); }

.session-list { display: grid; gap: 4px; }

.session-item {
  border: 1px solid transparent;
  background: transparent;
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  display: grid;
  gap: 4px;
  font: inherit;
  text-align: left;
  width: 100%;
  position: relative;
}

.session-item .archive-btn {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  display: none;
  border-radius: 4px;
}
.session-item:hover .archive-btn { display: flex; align-items: center; justify-content: center; }
.session-item .archive-btn:hover { background: #fee2e2; color: var(--danger); }
.session-item:hover { background: var(--panel-muted); }
.session-item.active {
  border-color: var(--accent);
  background: #eef4ff;
}

.session-title {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-time {
  font-size: 11px;
  color: var(--muted);
}

/* ── Main workspace ─────────────────────────────────────── */

.main-workspace {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg);
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.welcome-state {
  color: var(--muted);
  font-size: 15px;
  text-align: center;
  margin: auto;
  line-height: 1.8;
}

.empty-state {
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  padding: 20px;
}
.error-text { color: var(--danger); }

/* ── Message bubbles ────────────────────────────────────── */

.msg-group {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.msg-bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg-user {
  align-self: flex-end;
  background: #eef4ff;
  border: 1px solid #c4d4f5;
}

.msg-assistant {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
}

.msg-markdown {
  white-space: normal;
}
.msg-markdown p {
  margin: 0 0 8px;
}
.msg-markdown p:last-child {
  margin-bottom: 0;
}
.msg-markdown h1,
.msg-markdown h2,
.msg-markdown h3,
.msg-markdown h4 {
  margin: 10px 0 6px;
  line-height: 1.35;
}
.msg-markdown h1 { font-size: 18px; }
.msg-markdown h2 { font-size: 16px; }
.msg-markdown h3 { font-size: 14px; }
.msg-markdown h4 { font-size: 13px; }
.msg-markdown ul,
.msg-markdown ol {
  margin: 4px 0 10px 20px;
  padding: 0;
}
.msg-markdown li {
  margin: 3px 0;
}
.msg-markdown blockquote {
  margin: 6px 0 10px;
  padding: 4px 10px;
  border-left: 3px solid var(--border);
  color: var(--muted);
  background: var(--panel-muted);
  border-radius: 4px;
}
.msg-markdown pre {
  margin: 8px 0;
  padding: 10px 12px;
  background: #0f172a;
  color: #e5e7eb;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre;
}
.msg-markdown code {
  font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
}
.msg-markdown :not(pre) > code {
  background: #eef2f7;
  color: #1f2937;
  border: 1px solid #d9e1ec;
  border-radius: 4px;
  padding: 1px 4px;
  font-size: 12px;
}
.msg-markdown a {
  color: var(--accent);
  text-decoration: none;
}
.msg-markdown a:hover {
  text-decoration: underline;
}
.msg-markdown table {
  border-collapse: collapse;
  width: 100%;
  margin: 8px 0 10px;
  font-size: 12px;
}
.msg-markdown th,
.msg-markdown td {
  border: 1px solid var(--border);
  padding: 5px 7px;
  text-align: left;
  vertical-align: top;
}
.msg-markdown th {
  background: var(--panel-muted);
  font-weight: 600;
}
.msg-markdown hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 10px 0;
}

.msg-system {
  align-self: center;
  background: #fefce8;
  border: 1px solid #fde68a;
  font-style: italic;
  max-width: 85%;
  font-size: 12px;
}

.msg-error {
  align-self: center;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--danger);
  max-width: 85%;
  font-size: 12px;
}

/* ── Turn Summary ────────────────────────────────────────── */

.turn-summary {
  margin: 4px 0 8px 0;
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--panel);
  border-left: 3px solid var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}
.turn-summary.turn-running { border-left-color: #3b82f6; background: #eff6ff; }
.turn-summary.turn-completed { border-left-color: #22c55e; background: #f0fdf4; }
.turn-summary.turn-failed { border-left-color: #ef4444; background: #fef2f2; }
.turn-summary.turn-cancelled { border-left-color: #9ca3af; background: #f9fafb; }
.turn-summary.turn-max_iterations { border-left-color: #f59e0b; background: #fffbeb; }

.turn-status-text { font-weight: 600; }
.turn-sep { color: var(--border); }
.turn-duration { font-variant-numeric: tabular-nums; }
.turn-stats {}
.turn-spacer { flex: 1; }
.turn-expand-btn {
  cursor: pointer;
  color: var(--primary);
  font-size: 11px;
  white-space: nowrap;
}
.turn-expand-btn:hover { text-decoration: underline; }

.turn-failure-reason {
  color: var(--danger);
  margin-left: 4px;
  font-size: 11px;
}

.turn-spinner {
  display: inline-block;
  width: 10px; height: 10px;
  border: 2px solid #3b82f6;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-left: 4px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Tool Timeline ───────────────────────────────────────── */

.turn-timeline {
  margin: 0 0 10px 12px;
  padding: 8px 12px;
  border-left: 2px solid #e5e7eb;
  font-size: 12px;
}
.turn-timeline-loading {
  color: var(--muted);
  font-style: italic;
  padding: 4px 0;
}
.turn-timeline-empty {
  color: var(--muted);
  padding: 4px 0;
}
.tool-calls-header {
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text);
}

.tool-call-detail {
  margin: 2px 0;
}
.tool-call-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  cursor: pointer;
  list-style: none;
  font-size: 12px;
}
.tool-call-summary::-webkit-details-marker { display: none; }
.tool-call-name {
  font-weight: 600;
  color: var(--primary);
  min-width: 0;
}
.tool-call-path {
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}
.tool-call-duration {
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
  white-space: nowrap;
}
.tool-call-status {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 3px;
  white-space: nowrap;
}
.tool-call-status.success { background: #dcfce7; color: #166534; }
.tool-call-status.error { background: #fef2f2; color: #991b1b; }
.tool-call-status.running { background: #dbeafe; color: #1e40af; }

.tool-call-body {
  padding: 6px 0 4px 16px;
  font-size: 11px;
}
.tool-call-section { margin: 4px 0; }
.tool-call-section pre {
  margin: 2px 0 0 0;
  padding: 4px 8px;
  background: #f3f4f6;
  border-radius: 3px;
  font-size: 10px;
  max-height: 200px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all;
}
.tool-call-error { color: var(--danger); }

/* ── Loading bubble ─────────────────────────────────────── */

.loading-bubble {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.loading-bubble .dots {
  display: flex;
  gap: 4px;
}

.loading-bubble .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
.loading-bubble .dot:nth-child(2) { animation-delay: 0.2s; }
.loading-bubble .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}

.loading-text {
  font-size: 13px;
  color: var(--muted);
}

/* ── Tool accordion ─────────────────────────────────────── */

.tool-accordion {
  align-self: flex-start;
  max-width: 75%;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: #f8fafc;
}

.tool-accordion summary {
  cursor: pointer;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.tool-accordion summary:hover { background: #eef0f4; }

.tool-accordion-body {
  padding: 8px 12px;
  display: grid;
  gap: 8px;
  border-top: 1px solid var(--border);
}

.tool-step {
  font-size: 12px;
  display: grid;
  gap: 4px;
}

.tool-step-header {
  font-weight: 600;
  color: var(--text);
}

.tool-step-args,
.tool-step-result {
  font-family: "Cascadia Code", "Fira Code", monospace;
  font-size: 11px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 8px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 200px;
  overflow-y: auto;
}

.tool-step-error {
  color: var(--danger);
  font-weight: 500;
}

/* ── Chat input area ────────────────────────────────────── */

.chat-input-area {
  border-top: 1px solid var(--border);
  background: var(--panel);
  padding: 0;
}

.config-bar {
  display: flex;
  gap: 8px;
  padding: 8px 16px 0;
  align-items: center;
}

.config-bar select {
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  background: #fff;
  max-width: 180px;
}

.config-bar .spacer { flex: 1; }

.icon-btn {
  width: 32px;
  height: 32px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}
.icon-btn img {
   display: block;
 }
.icon-btn:hover { background: var(--panel-muted); }

/* ── Settings panel ─────────────────────────────────────── */

.config-panel {
  margin: 8px 16px 0;
  padding: 12px 14px;
  background: var(--panel-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: grid;
  gap: 10px;
  grid-template-columns: 1fr 1fr;
}

.config-panel[hidden] {
  display: none !important;
}

.config-panel label {
  display: grid;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
}

.config-panel input,
.config-panel select {
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font: inherit;
  font-size: 12px;
}

.config-panel .wide { grid-column: 1 / -1; }

.input-row {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  align-items: flex-end;
}

.input-row textarea {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
  font-size: 13px;
  resize: none;
  min-height: 42px;
  max-height: 150px;
}

.input-row button {
  flex-shrink: 0;
  padding: 10px 20px;
  font-weight: 600;
}

.input-row button.danger-outline {
  background: #fff;
  color: var(--danger);
  border-color: #fecaca;
  font-weight: 600;
}
.input-row button.danger-outline:hover {
  background: #fef2f2;
  border-color: var(--danger);
}

/* ── Buttons ────────────────────────────────────────────── */

button {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  font: inherit;
  cursor: pointer;
}
button:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

button.secondary {
  background: #fff;
  color: var(--text);
  border-color: var(--border);
}
button.secondary:hover { background: var(--panel-muted); }

/* ── Responsive ─────────────────────────────────────────── */

@media (max-width: 768px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .sidebar.open {
    display: flex;
    position: fixed;
    z-index: 10;
    left: 0;
    top: 0;
    bottom: 0;
    width: var(--sidebar-w);
  }
  .msg-bubble { max-width: 90%; }
  .chat-messages { padding: 12px 16px; }
  .config-panel { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <button id="newSessionBtn">+ 新建对话</button>
    </div>
    <div class="sidebar-body">
      <div id="sessionList" class="session-list">
        <div class="empty-state">暂无对话</div>
      </div>
    </div>
    <div class="sidebar-footer">
      <select id="langSelect" class="lang-select" aria-label="语言">
        <option value="zh">中文</option>
        <option value="en">EN</option>
      </select>
      <span id="healthDot" class="health-dot health-chk" title="检查中"></span>
    </div>
  </aside>

  <main class="main-workspace">
    <div id="chatMessages" class="chat-messages">
      <div class="welcome-state">
        选择一个已有的对话，<br>或点击左侧 <strong>+ 新建对话</strong> 开始。
      </div>
    </div>
    <div class="chat-input-area">
      <div class="config-bar">
        <select id="providerSelect" aria-label="Provider"></select>
        <select id="modelSelect" aria-label="Model"></select>
        <span class="spacer"></span>
        <button id="settingsToggle" class="icon-btn" title="会话设置"><img src="/assets/images/config.svg" alt="设置" width="18" height="18" /></button>
      </div>
      <div id="configPanel" class="config-panel" hidden>
        <label class="wide">
          仓库路径
          <input id="cfgWorkspace" type="text" value="." />
        </label>
        <label>
          最大迭代
          <input id="cfgMaxIterations" type="number" min="1" value="100" />
        </label>
        <label>
          最大 Tokens
          <input id="cfgMaxTokens" type="number" min="1" placeholder="默认" />
        </label>
      </div>
      <div class="input-row">
        <textarea id="chatInput"
          placeholder="输入消息…" rows="1"
          disabled></textarea>
        <button id="stopBtn" hidden>停止</button>
        <button id="sendBtn" disabled>发送</button>
      </div>
    </div>
  </main>
</div>

// ── Reusable utilities (kept from original) ──────────────────

async function requestJson(url, options = {}) {
  const response = await fetch(url, {
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
    ...options,
  });
  if (!response.ok) {
    let message = `${t("request_failed")}: ${response.status}`;
    try { const p = await response.json(); message = p.detail || JSON.stringify(p); } catch (_) {}
    throw new Error(message);
  }
  return response.json();
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function timestampText(value) {
  if (!value) return "-";
  const d = new Date(value);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  if (isToday) return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("zh-CN", { month: "short", day: "numeric" }) + " " +
    d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
}

function formatStatus(status) {
  const map = {
    idle: "空闲", running: "运行中", archived: "已归档",
    queued: "排队中", completed: "已完成", failed: "失败",
    cancelled: "已取消", max_iterations: "达到上限",
    model_output_truncated: "输出截断",
  };
  return map[status] || status || "未知";
}

function statusClass(status) {
  const map = {
    completed: "status-chip status-completed",
    running: "status-chip status-running", queued: "status-chip status-running",
    failed: "status-chip status-failed", cancelled: "status-chip status-cancelled",
    max_iterations: "status-chip status-failed",
    model_output_truncated: "status-chip status-failed",
    idle: "status-chip status-idle", archived: "status-chip status-cancelled",
  };
  return map[status] || "status-chip status-queued";
}

function statusDot(status) {
  const map = {
    idle: "var(--muted)", running: "var(--warning)", queued: "var(--warning)",
    completed: "var(--success)", failed: "var(--danger)", cancelled: "var(--muted)",
    max_iterations: "var(--danger)", model_output_truncated: "var(--danger)",
    archived: "var(--muted)",
  };
  return map[status] || "var(--muted)";
}

function providerLabel(provider) {
  const names = { deepseek: "DeepSeek", siliconflow: "SiliconFlow", mimo: "MiMo" };
  const base = names[provider.name] || provider.name;
  const hint = state.lang === "zh" ? "未配置" : "Not configured";
  return provider.configured ? base : base + " (" + hint + ")";
}

function formatDuration(ms) {
  if (!ms && ms !== 0) return "-";
  if (ms < 1000) return ms + "ms";
  return (ms / 1000).toFixed(1) + t("turn_duration_sec");
}

function turnStatusLabel(status) {
  const map = {
    queued: "turn_queued", running: "turn_running", completed: "turn_completed",
    failed: "turn_failed", cancelled: "turn_cancelled",
    max_iterations: "turn_max_iterations", model_output_truncated: "turn_failed",
  };
  return t(map[status] || "turn_failed");
}

function turnStatusDash(status) {
  return "turn-" + status;
}

function renderProviderModelControls(options = {}) {
  if (!state.modelProviders.length) return;
  const preserveModel = options.preserveModel !== false;
  const curProvider = providerSelect.value;
  const curModel = modelSelect.value;

  providerSelect.innerHTML = state.modelProviders
    .map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(providerLabel(p))}</option>`)
    .join("");

  const configured = state.modelProviders.find(p => p.configured);
  const fallback = configured || state.modelProviders[0];
  const names = new Set(state.modelProviders.map(p => p.name));
  const next = names.has(curProvider) ? curProvider : fallback.name;
  providerSelect.value = next;

  const desc = state.modelProviders.find(p => p.name === next) || fallback;
  const models = desc.models?.length ? desc.models : desc.default_model ? [desc.default_model] : [];

  modelSelect.innerHTML = models
    .map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`)
    .join("");

  if (preserveModel && models.includes(curModel)) {
    modelSelect.value = curModel;
  } else if (desc.default_model && models.includes(desc.default_model)) {
    modelSelect.value = desc.default_model;
  } else if (models.length) {
    modelSelect.value = models[0];
  }
}

async function loadModelProviders() {
  try {
    state.modelProviders = await requestJson("/models/providers");
    providerSelect.value = "";
    renderProviderModelControls({ preserveModel: false });
  } catch (_) {}
}

// ── Chat rendering ───────────────────────────────────────────

function renderChatMessages(messages) {
  if (!messages.length && !state.pendingUserMessage && !state.pendingLoadingBubble) {
    chatMessages.innerHTML = '<div class="empty-state">' + t("chat_empty") + '</div>';
    return;
  }

  let seenUserTurn = new Set();
  let html = "";

  for (const msg of messages) {
    if (msg.role === "assistant" && msg.tool_calls && msg.tool_calls.length && !(msg.content && msg.content.trim())) {
      continue;
    }

    if (msg.role === "tool") {
      continue;
    }

    if (msg.role === "assistant" && msg.tool_calls && msg.tool_calls.length && msg.content && msg.content.trim()) {
      html += '<div class="msg-bubble msg-assistant msg-markdown">' + formatContent(msg.content) + '</div>';
      continue;
    }

    if (msg.role === "system") {
      html += '<div class="msg-bubble msg-system">' + escapeHtml(msg.content || "") + '</div>';
      continue;
    }

    const bubbleClass = "msg-bubble msg-" + msg.role + (msg.role === "assistant" ? " msg-markdown" : "");
    html += '<div class="' + bubbleClass + '">';
    if (msg.role === "user") {
      html += escapeHtml(msg.content || "") + '</div>';

      const ti = msg.turn_index;
      if (ti !== undefined && ti !== null && !seenUserTurn.has(ti)) {
        seenUserTurn.add(ti);
        const turn = state.turns.find(t => t.turn_index === ti);
        if (turn) {
          const diag = state.turnDiagnostics[turn.id];
          html += renderTurnSummary(turn, diag);
        }
      }
    } else {
      html += formatContent(msg.content || "") + '</div>';
    }
  }

  chatMessages.innerHTML = html;

  if (state.pendingUserMessage) {
    chatMessages.innerHTML += '<div class="msg-bubble msg-user">' + escapeHtml(state.pendingUserMessage) + '</div>';
  }
  if (state.pendingLoadingBubble) {
    chatMessages.innerHTML += renderLoadingBubble();
  }

  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function formatContent(content) {
  if (!content) return "";

  const codeBlocks = [];
  let text = String(content).replace(/\r\n/g, "\n");
  text = text.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, function(_, lang, code) {
    const id = codeBlocks.length;
    codeBlocks.push({
      lang: String(lang || "").trim(),
      code: code.replace(/\n$/, ""),
    });
    return "\n@@CODE_BLOCK_" + id + "@@\n";
  });

  const lines = text.split("\n");
  const out = [];
  let paragraph = [];
  let listType = null;

  function flushParagraph() {
    if (!paragraph.length) return;
    out.push("<p>" + renderInline(paragraph.join(" ")) + "</p>");
    paragraph = [];
  }

  function closeList() {
    if (!listType) return;
    out.push("</" + listType + ">");
    listType = null;
  }

  function ensureList(type) {
    flushParagraph();
    if (listType === type) return;
    closeList();
    listType = type;
    out.push("<" + type + ">");
  }

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();

    if (!line) {
      flushParagraph();
      closeList();
      continue;
    }

    const codeMatch = line.match(/^@@CODE_BLOCK_(\d+)@@$/);
    if (codeMatch) {
      flushParagraph();
      closeList();
      const block = codeBlocks[Number(codeMatch[1])];
      const langClass = block.lang ? ' class="language-' + escapeHtml(block.lang) + '"' : "";
      out.push("<pre><code" + langClass + ">" + escapeHtml(block.code) + "</code></pre>");
      continue;
    }

    if (/^\|.+\|$/.test(line) && i + 1 < lines.length && /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(lines[i + 1].trim())) {
      flushParagraph();
      closeList();
      const headers = splitMarkdownTableRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|.+\|$/.test(lines[i].trim())) {
        rows.push(splitMarkdownTableRow(lines[i].trim()));
        i++;
      }
      i--;
      out.push(renderMarkdownTable(headers, rows));
      continue;
    }

    const heading = line.match(/^(#{1,4})\s+(.+)$/);
    if (heading) {
      flushParagraph();
      closeList();
      const level = heading[1].length;
      out.push("<h" + level + ">" + renderInline(heading[2]) + "</h" + level + ">");
      continue;
    }

    if (/^(-{3,}|\*{3,})$/.test(line)) {
      flushParagraph();
      closeList();
      out.push("<hr>");
      continue;
    }

    const quote = line.match(/^>\s?(.*)$/);
    if (quote) {
      flushParagraph();
      closeList();
      out.push("<blockquote>" + renderInline(quote[1]) + "</blockquote>");
      continue;
    }

    const unordered = line.match(/^[-*]\s+(.+)$/);
    if (unordered) {
      ensureList("ul");
      out.push("<li>" + renderInline(unordered[1]) + "</li>");
      continue;
    }

    const ordered = line.match(/^\d+\.\s+(.+)$/);
    if (ordered) {
      ensureList("ol");
      out.push("<li>" + renderInline(ordered[1]) + "</li>");
      continue;
    }

    closeList();
    paragraph.push(line);
  }

  flushParagraph();
  closeList();
  return out.join("");
}

function renderInline(value) {
  let html = escapeHtml(value);
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function(_, label, href) {
    return '<a href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
  });
  return html;
}

function splitMarkdownTableRow(line) {
  return line.replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
}

function renderMarkdownTable(headers, rows) {
  let html = "<table><thead><tr>";
  html += headers.map(h => "<th>" + renderInline(h) + "</th>").join("");
  html += "</tr></thead><tbody>";
  for (const row of rows) {
    html += "<tr>";
    html += headers.map((_, i) => "<td>" + renderInline(row[i] || "") + "</td>").join("");
    html += "</tr>";
  }
  html += "</tbody></table>";
  return html;
}

function renderToolAccordion(steps) {
  const toolNames = steps.map(s => s.tool_name).join(", ");
  const summaryText = "&#9881; " + t("tool_called").replace("{count}", steps.length) + ": " + escapeHtml(toolNames);

  const bodyHtml = steps.map(s => {
    let argsHtml = "";
    if (s.arguments && Object.keys(s.arguments).length) {
      argsHtml = '<div class="tool-step-args"><strong>' + t("tool_args") + ':</strong> ' + escapeHtml(s.raw_arguments || JSON.stringify(s.arguments, null, 2)) + '</div>';
    }
    let resultHtml = "";
    if (s.result !== null && s.result !== undefined) {
      const cls = s.error ? " tool-step-error" : "";
      resultHtml = '<div class="tool-step-result' + cls + '"><strong>' + (s.error ? t("tool_error") : t("tool_result")) + ':</strong> ' + escapeHtml(String(s.result).slice(0, 3000)) + '</div>';
    }
    return '<div class="tool-step">' +
      '<div class="tool-step-header">' + escapeHtml(s.tool_name) + '</div>' +
      argsHtml +
      resultHtml +
    '</div>';
  }).join("");

  return '<details class="tool-accordion">' +
    '<summary>' + summaryText + '</summary>' +
    '<div class="tool-accordion-body">' + bodyHtml + '</div>' +
  '</details>';
}

// ── Session chat load ────────────────────────────────────────

async function loadSessionChat() {
  const sid = state.selectedSessionId;
  if (!sid) return;

  try {
    const [session, messages, turns] = await Promise.all([
      requestJson("/sessions/" + sid),
      requestJson("/sessions/" + sid + "/messages?since_sequence=0"),
      requestJson("/sessions/" + sid + "/turns"),
    ]);

    state.currentSession = session;
    state.currentMessages = messages;
    state.turns = turns;
    state.turnDiagnostics = {};
    state.expandedTurns = new Set();
    state.turnToolEvents = {};

    if (messages.length > 0) {
      state.lastSequence = Math.max(...messages.map(m => m.sequence || 0));
    }

    const hasActive = turns.some(t => t.status === "running" || t.status === "queued");
    if (hasActive) {
      const activeTurn = turns.find(t => t.status === "running" || t.status === "queued");
      if (activeTurn) state.activeTurnId = activeTurn.id;
    } else {
      state.activeTurnId = null;
    }

    await loadTurnDiagnosticsBatch(sid, turns);

    state.pendingUserMessage = null;
    state.pendingLoadingBubble = false;
    removeLoadingBubble();
    renderChatMessages(messages);
    updateActionButtons();

    if (hasActive) {
      schedulePoll();
    }
  } catch (e) {
    chatMessages.innerHTML = '<div class="empty-state error-text">' + escapeHtml(e.message) + '</div>';
  }
}

async function loadTurnDiagnosticsBatch(sid, turns) {
  const targets = turns.filter(t => t.status !== "queued");
  const results = await Promise.allSettled(
    targets.map(t => requestJson("/sessions/" + sid + "/turns/" + t.id + "/diagnostics"))
  );
  targets.forEach((t, i) => {
    if (results[i].status === "fulfilled") {
      state.turnDiagnostics[t.id] = results[i].value;
    }
  });
}

async function loadTurnDiagnostics(sid, turnId) {
  try {
    const diag = await requestJson("/sessions/" + sid + "/turns/" + turnId + "/diagnostics");
    state.turnDiagnostics[turnId] = diag;
    return diag;
  } catch (_) {
    return null;
  }
}

function findTurnForMessage(msg) {
  if (!state.turns) return null;
  const ti = msg.turn_index;
  if (ti === undefined || ti === null) return null;
  return state.turns.find(t => t.turn_index === ti) || null;
}

function renderTurnSummary(turn, diagnostics) {
  if (!turn) return "";
  const diag = diagnostics || {};
  const status = turn.status;
  const duration = formatDuration(diag.total_duration_ms || 0);
  const modelCalls = diag.model_call_count || 0;
  const toolCalls = diag.tool_call_count || 0;
  const tokens = diag.token_usage?.total_tokens || 0;
  const isTerminal = ["completed", "failed", "cancelled", "max_iterations", "model_output_truncated"].includes(status);
  const expanded = state.expandedTurns.has(turn.id);

  let statsParts = [];
  if (isTerminal || status === "running") statsParts.push(t("turn_model_calls") + " " + modelCalls);
  if (isTerminal || status === "running") statsParts.push(t("turn_tool_calls") + " " + toolCalls);
  if (tokens) statsParts.push("Token " + tokens);

  let statusExtra = "";
  if (status === "running") {
    statusExtra = ' <span class="turn-spinner"></span>';
  }
  if (status === "failed" || status === "max_iterations" || status === "model_output_truncated") {
    const reason = turn.failure_reason || "";
    if (reason) statusExtra = ' <span class="turn-failure-reason">' + escapeHtml(reason.slice(0, 120)) + '</span>';
  }

  let html = '<div class="turn-summary ' + turnStatusDash(status) + '" data-turn-id="' + turn.id + '">';
  html += '<span class="turn-status-text">' + turnStatusLabel(status) + statusExtra + '</span>';
  if (isTerminal || status === "running") {
    html += '<span class="turn-sep">&middot;</span>';
    html += '<span class="turn-duration">' + duration + '</span>';
    html += '<span class="turn-sep">&middot;</span>';
    html += '<span class="turn-stats">' + statsParts.join(" &middot; ") + '</span>';
  }
  html += '<span class="turn-spacer"></span>';
  html += '<span class="turn-expand-btn" data-turn-id="' + turn.id + '">' + (expanded ? t("turn_collapse") : t("turn_expand")) + '</span>';
  html += '</div>';

  if (expanded) {
    html += '<div class="turn-timeline" id="timeline-' + turn.id + '">';
    const events = state.turnToolEvents[turn.id];
    if (events) {
      html += renderToolTimeline(turn.id, events);
    } else {
      html += '<div class="turn-timeline-loading">' + t("agent_thinking") + '</div>';
    }
    html += '</div>';
  }

  return html;
}

function renderToolTimeline(turnId, events) {
  const toolCalls = groupToolEvents(events);
  if (!toolCalls.length) {
    return '<div class="turn-timeline-empty">' + t("turn_no_tool_events") + '</div>';
  }
  let html = '<div class="tool-calls-header">' + t("turn_tool_call") + " " + toolCalls.length + " " + t("turn_times") + '</div>';
  for (const tc of toolCalls) {
    html += '<details class="tool-call-detail">';
    html += '<summary class="tool-call-summary">';
    html += '<span class="tool-call-name">' + escapeHtml(tc.toolName) + '</span>';
    html += '<span class="tool-call-path">' + escapeHtml(tc.argsHint) + '</span>';
    if (tc.durationMs) html += '<span class="tool-call-duration">' + formatDuration(tc.durationMs) + '</span>';
    const statusClass = tc.status === "success" ? "success" : (tc.status === "running" ? "running" : "error");
    const statusLabel = tc.status === "success"
      ? t("tool_status_success")
      : (tc.status === "running" ? t("tool_status_running") : t("tool_status_error"));
    html += '<span class="tool-call-status ' + statusClass + '">' + statusLabel + '</span>';
    html += '</summary>';
    html += '<div class="tool-call-body">';
    html += '<div class="tool-call-section"><strong>' + t("tool_args") + ':</strong><pre>' + escapeHtml(tc.argsJson || t("tool_args_none")) + '</pre></div>';
    if (tc.result) html += '<div class="tool-call-section"><strong>' + t("tool_result") + ':</strong><pre>' + escapeHtml(tc.result.slice(0, 2000)) + '</pre></div>';
    if (tc.failureReason) html += '<div class="tool-call-section tool-call-error"><strong>' + t("tool_status_error") + ':</strong> ' + escapeHtml(tc.failureReason) + '</div>';
    html += '</div></details>';
  }
  return html;
}

function groupToolEvents(events) {
  const started = {};
  const finished = {};
  for (const e of events) {
    const type = e.event_type || e.type;
    if (type === "tool.started") {
      const key = toolEventKey(e);
      started[key] = e;
    }
    if (type === "tool.finished") {
      const key = toolEventKey(e);
      finished[key] = e;
    }
  }
  const allKeys = new Set([...Object.keys(started), ...Object.keys(finished)]);
  const calls = [];
  for (const key of allKeys) {
    const s = started[key];
    const f = finished[key];
    const toolName = (f?.payload?.tool_name) || (s?.payload?.tool_name) || key;
    const args = (f?.payload?.arguments) || (s?.payload?.arguments) || {};
    const argsJson = Object.keys(args).length ? JSON.stringify(args, null, 2) : "";
    const result = f?.payload?.tool_result || "";
    const failureReason = f?.failure_reason;
    const durationMs = f?.duration_ms || 0;
    const status = f?.status || "running";
    let argsHint = "";
    const firstArg = typeof args === "object" && Object.values(args)[0];
    if (firstArg && typeof firstArg === "string") argsHint = firstArg.slice(0, 60);
    calls.push({ toolName, argsJson, argsHint, result, failureReason, durationMs, status });
  }
  return calls;
}

function toolEventKey(event) {
  const payload = event.payload || {};
  if (payload.tool_call_id) return payload.tool_call_id;
  const stepIndex = payload.step_index ?? event.index ?? "";
  return (payload.tool_name || "tool") + ":" + stepIndex;
}

async function loadTurnEvents(sid, turnId) {
  try {
    const events = await requestJson(
      "/sessions/" + sid + "/turns/" + turnId + "/events?include_payload=true&max_payload_chars=4000"
    );
    state.turnToolEvents[turnId] = events;
    return events;
  } catch (_) {
    return [];
  }
}

// ── Polling ──────────────────────────────────────────────────

function schedulePoll() {
  if (state.pollTimer) {
    clearTimeout(state.pollTimer);
    state.pollTimer = null;
  }
  state.pollTimer = window.setTimeout(async () => {
    await pollTurnStatus();
  }, 2000);
}

async function pollTurnStatus() {
  const sid = state.selectedSessionId;
  if (!sid || !state.activeTurnId) {
    state.pendingUserMessage = null;
    state.pendingLoadingBubble = false;
    removeLoadingBubble();
    updateActionButtons();
    return;
  }

  try {
    const [session, turns, messages] = await Promise.all([
      requestJson("/sessions/" + sid),
      requestJson("/sessions/" + sid + "/turns"),
      requestJson("/sessions/" + sid + "/messages?after_sequence=" + state.lastSequence),
    ]);

    if (messages.length > 0) {
      state.lastSequence = Math.max(...messages.map(m => m.sequence || 0));
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      removeLoadingBubble();
      updateActionButtons();
      await loadSessionChat();
      return;
    }

    const activeTurn = turns.find(t => t.id === state.activeTurnId);
    if (!activeTurn) {
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      removeLoadingBubble();
      state.activeTurnId = null;
      updateActionButtons();
      await loadSessionChat();
      await loadSessions();
      return;
    }

    const diag = await loadTurnDiagnostics(sid, activeTurn.id);
    if (diag && state.expandedTurns.has(activeTurn.id)) {
      try {
        await loadTurnEvents(sid, activeTurn.id);
      } catch (_) {}
    }
    state.turns = turns;
    if (diag) {
      renderChatMessages(state.currentMessages);
    }

    const terminalStatuses = ["completed", "failed", "cancelled", "max_iterations", "model_output_truncated"];
    if (terminalStatuses.includes(activeTurn.status)) {
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      removeLoadingBubble();
      state.activeTurnId = null;
      updateActionButtons();
      if (activeTurn.status === "failed" || activeTurn.status === "max_iterations" || activeTurn.status === "model_output_truncated") {
        const errMsg = activeTurn.status === "failed" ? t("turn_failed") : t("turn_failed");
        const detail = activeTurn.failure_reason ? ": " + activeTurn.failure_reason : "";
        chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(errMsg + detail) + '</div>';
      }
      await loadSessionChat();
      await loadSessions();
      return;
    }

    const sessionTerminal = session.status === "idle" && !turns.some(t => t.status === "running" || t.status === "queued");
    if (sessionTerminal) {
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      removeLoadingBubble();
      state.activeTurnId = null;
      updateActionButtons();
      await loadSessionChat();
      return;
    }

    schedulePoll();
  } catch (e) {
    schedulePoll();
  }
}

// ── Send message (optimistic) ────────────────────────────────

async function sendMessage() {
  const message = chatInput.value.trim();
  if (!message) return;

  let sid = state.selectedSessionId;

  if (!sid) {
    const wsRoot = cfgWorkspace.value.trim();
    if (!wsRoot) {
      chatMessages.innerHTML = '<div class="msg-bubble msg-system">请先在设置中填写仓库路径。</div>';
      return;
    }
    try {
      const session = await requestJson("/sessions", {
        method: "POST",
        body: JSON.stringify({
          workspace_root: wsRoot,
          max_iterations: parseInt(cfgMaxIterations.value) || 100,
          max_tokens: cfgMaxTokens.value ? parseInt(cfgMaxTokens.value) : undefined,
          provider: providerSelect.value || undefined,
          model: modelSelect.value || undefined,
        }),
      });
      sid = session.id;
      state.selectedSessionId = sid;
      state.lastSequence = 0;
      state.currentSession = session;
      state.currentMessages = [];
      state.turns = [];
      state.turnDiagnostics = {};
      state.expandedTurns = new Set();
      state.turnToolEvents = {};
      state.pendingUserMessage = message;
      state.pendingLoadingBubble = true;
      await loadSessions();
      renderChatMessages([]);
      updateActionButtons();
    } catch (e) {
      chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(e.message) + '</div>';
      return;
    }
  }

  chatInput.value = "";
  chatInput.style.height = "auto";

  state.pendingUserMessage = message;
  state.pendingLoadingBubble = true;

  renderChatMessages(state.currentMessages);
  updateActionButtons();

  try {
    const turn = await requestJson("/sessions/" + sid + "/turns", {
      method: "POST",
      body: JSON.stringify({ message }),
    });
    state.activeTurnId = turn.id;
    state.turns = [...(state.turns || []), turn];
    state.turnDiagnostics[turn.id] = null;
    state.expandedTurns.delete(turn.id);
    delete state.turnToolEvents[turn.id];
    updateActionButtons();
    schedulePoll();
  } catch (e) {
    state.pendingUserMessage = null;
    state.pendingLoadingBubble = false;
    chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(e.message) + '</div>';
    state.activeTurnId = null;
    updateActionButtons();
  }
}

// ── Cancel current turn ──────────────────────────────────────

async function cancelCurrentTurn() {
  if (!state.selectedSessionId || !state.activeTurnId) return;
  stopBtn.disabled = true;
  try {
    await requestJson(
      "/sessions/" + state.selectedSessionId + "/turns/" + state.activeTurnId + "/cancel",
      { method: "POST" },
    );
    state.pendingUserMessage = null;
    state.pendingLoadingBubble = false;
    state.activeTurnId = null;
    removeLoadingBubble();
    updateActionButtons();
    await loadSessionChat();
    await loadSessions();
  } catch (e) {
    chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(e.message) + '</div>';
  } finally {
    stopBtn.disabled = false;
  }
}

// ── Archive session ──────────────────────────────────────────

async function archiveSession(sessionId) {
  if (!confirm(t("archive_confirm"))) return;
  const session = state.sessions.find(s => s.id === sessionId);
  if (session && session.status === "running") {
    chatMessages.innerHTML += '<div class="msg-bubble msg-system">' + t("stop_first") + '</div>';
    return;
  }
  try {
    await requestJson("/sessions/" + sessionId, { method: "DELETE" });
    if (state.selectedSessionId === sessionId) {
      state.selectedSessionId = null;
      state.activeTurnId = null;
      state.currentSession = null;
      state.currentMessages = [];
      state.pendingUserMessage = null;
      state.pendingLoadingBubble = false;
      state.lastSequence = 0;
      removeLoadingBubble();
      chatMessages.innerHTML = '<div class="empty-state">' + t("chat_empty") + '</div>';
      updateActionButtons();
    }
    await loadSessions();
  } catch (e) {
    chatMessages.innerHTML += '<div class="msg-bubble msg-error">' + escapeHtml(e.message) + '</div>';
  }
}

// ── Action button state machine ──────────────────────────────

function updateActionButtons() {
  const hasActive = !!state.activeTurnId;
  const archived = state.currentSession?.status === "archived";

  chatInput.disabled = archived || hasActive;
  sendBtn.disabled = archived || hasActive;
  stopBtn.hidden = !hasActive;
  stopBtn.disabled = !hasActive;

  if (archived) {
    chatInput.placeholder = t("archived_desc");
  } else if (!hasActive) {
    chatInput.placeholder = t("input_placeholder");
  }
}

function autoResizeTextarea() {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + "px";
}

// ── Event listeners ──────────────────────────────────────────

chatMessages.addEventListener("click", async (e) => {
  const btn = e.target.closest(".turn-expand-btn");
  if (!btn) return;
  const turnId = btn.getAttribute("data-turn-id");
  const sid = state.selectedSessionId;
  if (!turnId || !sid) return;

  if (state.expandedTurns.has(turnId)) {
    state.expandedTurns.delete(turnId);
  } else {
    state.expandedTurns.add(turnId);
    if (!state.turnToolEvents[turnId]) {
      try {
        await loadTurnEvents(sid, turnId);
      } catch (_) {}
    }
    const turn = state.turns.find(t => t.id === turnId);
    if (turn && ["queued", "running"].includes(turn.status)) {
      state.turnToolEvents[turnId] = state.turnToolEvents[turnId] || [];
    }
  }
  renderChatMessages(state.currentMessages);
});

sendBtn.addEventListener("click", sendMessage);
stopBtn.addEventListener("click", cancelCurrentTurn);
chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
chatInput.addEventListener("input", autoResizeTextarea);

document.getElementById("newSessionBtn").addEventListener("click", () => {
  state.selectedSessionId = null;
  state.lastSequence = 0;
  state.activeTurnId = null;
  state.currentSession = null;
  state.currentMessages = [];
  state.turns = [];
  state.turnDiagnostics = {};
  state.expandedTurns = new Set();
  state.turnToolEvents = {};
  state.pendingUserMessage = null;
  state.pendingLoadingBubble = false;
  removeLoadingBubble();
  renderSessionList();
  chatMessages.innerHTML = '<div class="empty-state">' + t("chat_empty") + '</div>';
  chatInput.focus();
  updateActionButtons();
});

settingsToggle.addEventListener("click", () => {
  configPanel.hidden = !configPanel.hidden;
});

providerSelect.addEventListener("change", () => {
  renderProviderModelControls({ preserveModel: false });
});

langSelect.addEventListener("change", () => {
  state.lang = langSelect.value === "en" ? "en" : "zh";
  localStorage.setItem("ui_lang", state.lang);
  document.documentElement.lang = state.lang === "en" ? "en" : "zh-CN";
  applyI18n();
  loadSessions();
  if (state.selectedSessionId) loadSessionChat();
});

// ── I18n apply ───────────────────────────────────────────────

function applyI18n() {
  document.getElementById("newSessionBtn").textContent = "+ " + t("new_session");
  if (!state.selectedSessionId) {
    chatInput.placeholder = t("input_placeholder");
  }
  sendBtn.textContent = t("send");
  stopBtn.textContent = t("stop");
  settingsToggle.title = t("settings_title");
  cfgMaxTokens.placeholder = t("max_tokens_placeholder");
  document.querySelector('.config-panel label.wide').childNodes[0].textContent = t("workspace_root");
  const panelLabels = configPanel.querySelectorAll("label:not(.wide)");
  if (panelLabels.length >= 2) {
    panelLabels[0].childNodes[0].textContent = t("max_iterations");
    panelLabels[1].childNodes[0].textContent = t("max_tokens");
  }
  healthDot.title = state.lang === "en"
    ? (healthDot.className.includes("health-ok") ? "API OK" : healthDot.className.includes("health-err") ? "API Error" : "Checking")
    : (healthDot.className.includes("health-ok") ? "API 正常" : healthDot.className.includes("health-err") ? "API 异常" : "检查中");
}

// ── Workspace persistence ───────────────────────────────────

cfgWorkspace.value = localStorage.getItem("workspace_root") || ".";

cfgWorkspace.addEventListener("change", () => {
  localStorage.setItem("workspace_root", cfgWorkspace.value.trim());
});

cfgWorkspace.addEventListener("blur", () => {
  localStorage.setItem("workspace_root", cfgWorkspace.value.trim());
});

// ── Startup ──────────────────────────────────────────────────

langSelect.value = state.lang === "en" ? "en" : "zh";
document.documentElement.lang = state.lang === "en" ? "en" : "zh-CN";
applyI18n();
loadHealth();
loadModelProviders();
loadSessions();
</script>
