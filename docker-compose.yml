services:
  code-review-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: code-review-agent:local
    ports:
      - "${CODE_REVIEW_AGENT_PORT:-3210}:3210"
    env_file:
      - .env
    environment:
      PORT: 3210
      CODE_REVIEW_AGENT_DB_PATH: /app/.data/code-review-agent.sqlite
    volumes:
      - code-review-agent-data:/app/.data
      - ${CODE_REVIEW_WORKSPACE_HOST_ROOT:-.}:/workspaces/project
    restart: unless-stopped

volumes:
  code-review-agent-data:
