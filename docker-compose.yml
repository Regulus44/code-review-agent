services:
  coding-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: coding-agent:local
    ports:
      - "${CODING_AGENT_PORT:-${CODE_REVIEW_AGENT_PORT:-3210}}:3210"
    env_file:
      - .env
    environment:
      PORT: 3210
    volumes:
      # Preserve the existing named volume during the rebrand. The database
      # resolver will reuse code-review-agent.sqlite when it is the only file.
      - code-review-agent-data:/app/.data
      - ${CODING_AGENT_WORKSPACE_HOST_ROOT:-${CODE_REVIEW_WORKSPACE_HOST_ROOT:-.}}:/workspaces/project
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  code-review-agent-data:
